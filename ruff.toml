# 额外排除路径
extend-exclude = ["**/generated/**"]
# 行宽
line-length = 100
# 预览模式
preview = false
# 源码根
src = ["apps/server/src"]
# 目标版本
target-version = "py312"
# 不安全修复
unsafe-fixes = false

# 格式化
[format]
# docstring 内代码格式化
docstring-code-format = true
# 换行符
line-ending = "lf"
# 引号风格
quote-style = "double"

# 检查
[lint]
# 预览规则须以完整规则码选择
explicit-preview-rules = true
# 禁用规则
ignore = [
  "COM812",
  "COM819",
  "CPY001",
  "D203",
  "D206",
  "D213",
  "D300",
  "D400",
  "D415",
  "E111",
  "E114",
  "E117",
  "FBT001",
  "FBT002",
  "G004",
  "ISC001",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "RUF001",
  "RUF002",
  "RUF003",
  "SLOT000",
  "TRY003",
  "TRY300",
  "W191",
]
# 日志器对象
logger-objects = ["server.core.logging.get_logger"]
# 预览模式
preview = true
# 启用规则
select = ["ALL", "DOC201", "RUF029"]

# 导入排序
[lint.isort]
# 单行导入
force-single-line = true
# 分组内排序
force-sort-within-sections = true
# 第一方模块
known-first-party = ["server"]
# 导入后空行数
lines-after-imports = 2
# 尾逗号拆分
split-on-trailing-comma = true

# 导入约定
[lint.flake8-import-conventions]
# 禁用的 from 导入
banned-from = ["typing"]

# 导入检查
[lint.flake8-tidy-imports]
# 相对导入层级
ban-relative-imports = "parents"

# 禁用导入
[lint.flake8-tidy-imports.banned-api]
# 统一用 UTC
"datetime.datetime.utcnow".msg = "使用 datetime.now(UTC)"
# 统一用 httpx
"requests".msg = "使用 httpx"

# 不可变调用
[lint.flake8-bugbear]
# 视为不可变的默认值调用
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
]

# 复杂度
[lint.mccabe]
# 复杂度上限
max-complexity = 10

# 按文件禁用
[lint.per-file-ignores]
# 依赖注入参数
"apps/*/src/*/api/**" = ["ARG001"]
# 框架签名
"apps/*/src/*/core/logging.py" = ["ARG001"]
# 测试文件
"apps/*/tests/**" = ["ANN001", "ANN201", "D103", "PLR2004", "S101", "S105", "S106"]

# 文档字符串
[lint.pydocstyle]
# 文档约定
convention = "google"
# 豁免装饰器
ignore-decorators = ["*/delete", "*/get", "*/patch", "*/post", "*/put", "typing.overload"]
