# 额外排除
extend-exclude = ["apps/server/src/server/generated/**"]
# 行宽
line-length = 100
# 预览模式
preview = false
# 源码目录
src = ["apps/server/src"]
# 目标版本
target-version = "py312"
# 不安全修复
unsafe-fixes = false

[format]
# docstring 代码
docstring-code-format = true
# 缩进
indent-style = "space"
# 换行符
line-ending = "lf"
# 引号
quote-style = "double"
# 魔法尾逗号
skip-magic-trailing-comma = false

[lint]
# 禁用规则
ignore = [
  # 尾逗号
  "COM812",
  # 版权声明
  "CPY001",
  # 与 D211 互斥
  "D203",
  # 与 D212 互斥
  "D213",
  # 中文句号
  "D400",
  # 中文标点
  "D415",
  # 布尔参数
  "FBT001",
  # 布尔参数
  "FBT002",
  # f-string 日志
  "G004",
  # 字符串折行
  "ISC001",
  # 全角标点
  "RUF001",
  # 全角标点
  "RUF002",
  # 全角标点
  "RUF003",
  # __slots__
  "SLOT000",
  # 长错误消息
  "TRY003",
  # try 内返回
  "TRY300",
]
# 日志器对象
logger-objects = ["server.core.logging.get_logger"]
# 启用规则
select = ["ALL"]

[lint.isort]
# 合并别名导入
combine-as-imports = false
# 单行导入
force-single-line = true
# 分组内排序
force-sort-within-sections = true
# 第一方模块
known-first-party = ["server"]
# 导入后空行
lines-after-imports = 2
# 按类型排序
order-by-type = true
# 相对导入顺序
relative-imports-order = "furthest-to-closest"
# 尾逗号拆分
split-on-trailing-comma = true

[lint.flake8-import-conventions]
# 禁用导入
banned-from = ["typing"]

[lint.flake8-tidy-imports.banned-api]
# 统一用 UTC
"datetime.datetime.utcnow".msg = "使用 datetime.now(UTC)"
# 统一用 httpx
"requests".msg = "使用 httpx"

[lint.mccabe]
# 复杂度上限
max-complexity = 10

[lint.per-file-ignores]
# 依赖注入参数
"apps/server/src/server/api/**" = ["ARG001"]
# 框架签名
"apps/server/src/server/core/logging.py" = ["ARG001"]
# 测试放宽
"apps/server/tests/**" = ["ANN001", "ANN201", "D103", "PLR2004", "S101", "S105", "S106"]

[lint.pycodestyle]
# 行宽上限
max-line-length = 100

[lint.pydocstyle]
# 文档约定
convention = "google"
# 豁免装饰器
ignore-decorators = ["*/delete", "*/get", "*/patch", "*/post", "*/put", "typing.overload"]
