# 额外排除
extend-exclude = ["**/generated/**"]
# 行宽
line-length = 100
# 预览模式
preview = false
# 源码目录
src = ["apps/server/src"]
# 目标版本
target-version = "py312"
# 不安全修复
unsafe-fixes = false

# 格式化
[format]
# docstring 代码
docstring-code-format = true
# 换行符（默认 auto 会随文件已有换行，此处统一下为 lf）
line-ending = "lf"
# 引号
quote-style = "double"

# 检查
[lint]
# 预览规则须显式指定完整规则码
explicit-preview-rules = true
# 禁用规则
ignore = [
  # 尾逗号
  "COM812",
  # 禁止尾逗号（与 formatter 冲突）
  "COM819",
  # 版权声明
  "CPY001",
  # 与 D211 互斥
  "D203",
  # docstring 制表符缩进（与 formatter 冲突）
  "D206",
  # 与 D212 互斥
  "D213",
  # 三单引号（与 formatter 冲突）
  "D300",
  # 中文句号
  "D400",
  # 中文标点
  "D415",
  # 缩进非 4 的倍数（与 formatter 冲突）
  "E111",
  # 缩进注释非 4 的倍数（与 formatter 冲突）
  "E114",
  # 过度缩进（与 formatter 冲突）
  "E117",
  # 布尔参数
  "FBT001",
  # 布尔参数
  "FBT002",
  # f-string 日志
  "G004",
  # 字符串折行
  "ISC001",
  # 单引号字面量（与 formatter 冲突）
  "Q000",
  # 单引号多行字符串（与 formatter 冲突）
  "Q001",
  # 单引号 docstring（与 formatter 冲突）
  "Q002",
  # 可避免的转义引号（与 formatter 冲突）
  "Q003",
  # 多余转义引号（与 formatter 冲突）
  "Q004",
  # 全角标点
  "RUF001",
  # 全角标点
  "RUF002",
  # 全角标点
  "RUF003",
  # __slots__
  "SLOT000",
  # 长错误消息
  "TRY003",
  # try 内返回
  "TRY300",
  # 制表符缩进（与 formatter 冲突）
  "W191",
]
# 日志器对象
logger-objects = ["server.core.logging.get_logger"]
# 预览规则（仅 lint，不影响格式化）
preview = true
# 启用规则
select = ["ALL", "DOC201", "RUF029"]

# 导入排序
[lint.isort]
# 单行导入
force-single-line = true
# 分组内排序
force-sort-within-sections = true
# 第一方模块
known-first-party = ["server"]
# 导入后空行
lines-after-imports = 2
# 尾逗号拆分
split-on-trailing-comma = true

# 导入约定
[lint.flake8-import-conventions]
# 禁用导入
banned-from = ["typing"]

# 导入检查
[lint.flake8-tidy-imports]
# 禁止相对导入（仅允许同包内 . 前缀，禁止 .. 及更远）
ban-relative-imports = "parents"

# 禁用导入
[lint.flake8-tidy-imports.banned-api]
# 统一用 UTC
"datetime.datetime.utcnow".msg = "使用 datetime.now(UTC)"
# 统一用 httpx
"requests".msg = "使用 httpx"

# 不可变默认值（避免 B008 误报框架依赖注入）
[lint.flake8-bugbear]
# FastAPI 声明式默认值本质是标记，不产生每次调用的新对象
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
]

# 复杂度
[lint.mccabe]
# 复杂度上限
max-complexity = 10

# 按文件禁用
[lint.per-file-ignores]
# 依赖注入参数（通配包名，便于新增 Python 包时自动覆盖）
"apps/*/src/*/api/**" = ["ARG001"]
# 框架签名（同上）
"apps/*/src/*/core/logging.py" = ["ARG001"]
# 测试放宽
"apps/*/tests/**" = ["ANN001", "ANN201", "D103", "PLR2004", "S101", "S105", "S106"]

# 文档字符串
[lint.pydocstyle]
# 文档约定
convention = "google"
# 豁免装饰器
ignore-decorators = ["*/delete", "*/get", "*/patch", "*/post", "*/put", "typing.overload"]
