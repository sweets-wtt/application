# 追加排除
extend-exclude = [
  # 契约生成物
  "apps/server/src/server/generated/**",
  # Alembic 自动生成迁移
  "apps/server/alembic/versions/**",
]

# 源码根
src = ["apps/server/src"]

# 目标 Python 版本 - 与根 .python-version 一致
target-version = "py312"

# 行宽 - 与 oxfmt、dprint 统一为 100
line-length = 100

# 格式化
[format]
# docstring 内代码 - 一并格式化
docstring-code-format = true
# 缩进 - 统一空格
indent-style = "space"
# 换行符 - 统一 LF
line-ending = "lf"
# 字符串引号 - 统一双引号
quote-style = "double"
# 魔法尾逗号 - 保留, 与 isort 拆分策略一致
skip-magic-trailing-comma = false

# Lint 配置
[lint]
# 规则集 - 按字母排序
select = [
  # 内置规则
  "A",
  # 类型注解
  "ANN",
  # 未使用参数
  "ARG",
  # 异步
  "ASYNC",
  # Bugbear
  "B",
  # 盲异常
  "BLE",
  # 推导式
  "C4",
  # 复杂度
  "C90",
  # docstring
  "D",
  # 时区
  "DTZ",
  # pycodestyle
  "E",
  # 错误消息
  "EM",
  # pyflakes
  "F",
  # future annotations
  "FA",
  # FastAPI
  "FAST",
  # 布尔位置参数
  "FBT",
  # 日志格式
  "G",
  # isort
  "I",
  # 隐式命名空间包
  "INP",
  # 日志调用
  "LOG",
  # 命名
  "N",
  # pygrep
  "PGH",
  # flake8-pie
  "PIE",
  # 性能
  "PERF",
  # Pylint refactor
  "PLR",
  # pytest
  "PT",
  # pathlib
  "PTH",
  # return
  "RET",
  # raise
  "RSE",
  # Ruff
  "RUF",
  # bandit
  "S",
  # 简化
  "SIM",
  # 私有成员
  "SLF",
  # print
  "T20",
  # type-checking
  "TC",
  # TODO
  "TD",
  # tryceratops
  "TRY",
  # pyupgrade
  "UP",
  # pycodestyle warnings
  "W",
]

# 忽略 - 中文 docstring 不加英文尾点
ignore = ["D415"]

# 文档字符串惯例
[lint.pydocstyle]
convention = "google"

# isort
[lint.isort]
# 合并同一模块的 as 导入
combine-as-imports = true
# 第一方模块
known-first-party = ["server"]
# import 块后空两行
lines-after-imports = 2
# 尾逗号触发多行拆分
split-on-trailing-comma = true

# pycodestyle
[lint.pycodestyle]
# 行宽 - 与 line-length 一致
max-line-length = 100

# mccabe
[lint.mccabe]
# 最大圈复杂度
max-complexity = 10

# 按路径豁免
[lint.per-file-ignores]
# 迁移环境 - 允许无 docstring、无注解与隐式命名空间
"apps/server/alembic/**" = ["D", "ANN", "INP001", "ARG001"]
# 异常处理器 - request 参数为 FastAPI 签名所需
"apps/server/src/server/core/exceptions.py" = ["ARG001"]
# 日志工具 - structlog processor 签名为框架约定
"apps/server/src/server/core/logging.py" = ["ANN401", "ARG001"]
# 测试目录 - 允许 assert, 不强制 docstring 与注解
"apps/server/tests/**" = ["S101", "D", "ANN", "ARG001", "ARG002", "PLR2004", "INP001"]
