# 追加排除
extend-exclude = [
  # 契约生成物
  "apps/server/src/server/generated/**",
]
# 行宽
line-length = 100
# 源码根
src = ["apps/server/src"]
# 目标 Python 版本
target-version = "py312"

# 格式化
[format]
# docstring 内代码
docstring-code-format = true
# 缩进
indent-style = "space"
# 换行符
line-ending = "lf"
# 字符串引号
quote-style = "double"
# 魔法尾逗号
skip-magic-trailing-comma = false

# Lint 配置
[lint]
# 忽略规则
ignore = ["D415"]
# 规则集
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "D",
  "DTZ",
  "E",
  "EM",
  "F",
  "FA",
  "FAST",
  "FBT",
  "G",
  "I",
  "INP",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PLR",
  "PT",
  "PTH",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "T20",
  "TC",
  "TD",
  "TRY",
  "UP",
  "W",
]

# isort
[lint.isort]
# 合并同一模块的 as 导入
combine-as-imports = false
# 每个 import 独占一行
force-single-line = true
# 同一 section 内强制排序
force-sort-within-sections = true
# 第一方模块
known-first-party = ["server"]
# import 块后空行数
lines-after-imports = 2
# from import 内按常量、类、函数排序
order-by-type = true
# 相对导入顺序
relative-imports-order = "furthest-to-closest"
# 尾逗号拆分
split-on-trailing-comma = true

# mccabe
[lint.mccabe]
# 最大圈复杂度
max-complexity = 10

# 按路径豁免
[lint.per-file-ignores]
# 测试目录 - 断言使用 assert
"apps/server/tests/**" = ["S101"]

# pycodestyle
[lint.pycodestyle]
# 行宽
max-line-length = 100

# 文档字符串惯例
[lint.pydocstyle]
# 约定
convention = "google"
