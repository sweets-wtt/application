# 追加排除
extend-exclude = [
  # 契约生成物
  "apps/server/src/server/generated/**",
]
# 行宽
line-length = 100
# 源码根
src = ["apps/server/src"]
# 目标 Python 版本
target-version = "py312"

# 格式化
[format]
# docstring 内代码
docstring-code-format = true
# 缩进
indent-style = "space"
# 换行符
line-ending = "lf"
# 字符串引号
quote-style = "double"
# 魔法尾逗号
skip-magic-trailing-comma = false

# Lint 配置
[lint]
# 忽略规则
ignore = ["D415"]
# 规则集
select = [
  # 内置规则
  "A",
  # 类型注解
  "ANN",
  # 未使用参数
  "ARG",
  # 异步
  "ASYNC",
  # Bugbear
  "B",
  # 盲异常
  "BLE",
  # 推导式
  "C4",
  # 复杂度
  "C90",
  # docstring
  "D",
  # 时区
  "DTZ",
  # pycodestyle
  "E",
  # 错误消息
  "EM",
  # pyflakes
  "F",
  # future annotations
  "FA",
  # FastAPI
  "FAST",
  # 布尔位置参数
  "FBT",
  # 日志格式
  "G",
  # isort
  "I",
  # 隐式命名空间包
  "INP",
  # 日志调用
  "LOG",
  # 命名
  "N",
  # 性能
  "PERF",
  # pygrep
  "PGH",
  # flake8-pie
  "PIE",
  # Pylint refactor
  "PLR",
  # pytest
  "PT",
  # pathlib
  "PTH",
  # return
  "RET",
  # raise
  "RSE",
  # Ruff
  "RUF",
  # bandit
  "S",
  # 简化
  "SIM",
  # 私有成员
  "SLF",
  # print
  "T20",
  # type-checking
  "TC",
  # TODO
  "TD",
  # tryceratops
  "TRY",
  # pyupgrade
  "UP",
  # pycodestyle warnings
  "W",
]

# isort
[lint.isort]
# 合并同一模块的 as 导入
combine-as-imports = false
# 每个 import 独占一行
force-single-line = true
# 同一 section 内强制排序
force-sort-within-sections = true
# 第一方模块
known-first-party = ["server"]
# import 块后空行数
lines-after-imports = 2
# from import 内按常量、类、函数排序
order-by-type = true
# 相对导入顺序
relative-imports-order = "furthest-to-closest"
# 尾逗号拆分
split-on-trailing-comma = true

# mccabe
[lint.mccabe]
# 最大圈复杂度
max-complexity = 10

# 按路径豁免
[lint.per-file-ignores]
# 异常处理器
"apps/server/src/server/core/exceptions.py" = ["ARG001"]
# 日志工具
"apps/server/src/server/core/logging.py" = ["ANN401", "ARG001"]
# 测试目录
"apps/server/tests/**" = ["ANN", "ARG001", "ARG002", "D", "INP001", "PLR2004", "S101"]

# pycodestyle
[lint.pycodestyle]
# 行宽
max-line-length = 100

# 文档字符串惯例
[lint.pydocstyle]
convention = "google"
