# 追加排除
extend-exclude = ["apps/server/src/server/generated/**"]
# 行宽
line-length = 100
# 源码根
src = ["apps/server/src"]
# 目标 Python 版本
target-version = "py312"

# 格式化
[format]
# docstring 内代码
docstring-code-format = true
# 缩进
indent-style = "space"
# 换行符
line-ending = "lf"
# 字符串引号
quote-style = "double"
# 魔法尾逗号
skip-magic-trailing-comma = false

# Lint 配置
[lint]
# 忽略规则
ignore = [
  # 中文 docstring 不加英文尾点
  "D415",
  # 路由签名使用布尔参数
  "FBT001",
  "FBT002",
  # structlog 使用 f-string
  "G004",
  # 中文全角标点
  "RUF001",
  "RUF002",
  "RUF003",
  # 部分类不要求 __slots__
  "SLOT000",
  # 接口层长错误消息
  "TRY003",
  "TRY300",
]
# 日志对象
logger-objects = ["server.core.logging.get_logger"]
# 规则集
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "D",
  "DTZ",
  "E",
  "EM",
  "F",
  "FA",
  "FAST",
  "FBT",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T20",
  "TC",
  "TD",
  "TID",
  "TRY",
  "UP",
  "W",
]

# isort
[lint.isort]
# 合并同一模块的 as 导入
combine-as-imports = false
# 每个 import 独占一行
force-single-line = true
# 同一 section 内强制排序
force-sort-within-sections = true
# 第一方模块
known-first-party = ["server"]
# import 块后空行数
lines-after-imports = 2
# from import 内按常量、类、函数排序
order-by-type = true
# 相对导入顺序
relative-imports-order = "furthest-to-closest"
# 尾逗号拆分
split-on-trailing-comma = true

# 导入别名约定
[lint.flake8-import-conventions]
# 禁止从 typing 直接导入
banned-from = ["typing"]

# 导入禁令
[lint.flake8-tidy-imports.banned-api]
# 禁止 naive UTC
"datetime.datetime.utcnow".msg = "使用 datetime.now(UTC)"
# 统一 HTTP 客户端
"requests".msg = "使用 httpx"

# mccabe
[lint.mccabe]
# 最大圈复杂度
max-complexity = 10

# 按路径豁免
[lint.per-file-ignores]
# 接口层 - 依赖注入参数
"apps/server/src/server/api/**" = ["ARG001"]
# 日志工具 - 框架签名
"apps/server/src/server/core/logging.py" = ["ARG001"]
# 测试目录 - 断言与 fixture 约定
"apps/server/tests/**" = ["ANN001", "ANN201", "D103", "PLR2004", "S101", "S105", "S106"]

# pycodestyle
[lint.pycodestyle]
# 行宽
max-line-length = 100

# 文档字符串惯例
[lint.pydocstyle]
# 约定
convention = "google"
# 豁免装饰器
ignore-decorators = ["*/delete", "*/get", "*/patch", "*/post", "*/put", "typing.overload"]
