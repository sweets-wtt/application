# 任务
version: "3"

# 任务
tasks:
  install:
    desc: 安装
    cmds:
      - task: install:tools
      - task: install:hooks

  install:tools:
    desc: 安装工具
    cmds:
      - mise install --locked

  install:hooks:
    desc: 安装钩子
    cmds:
      - lefthook install

  outdated:
    desc: 更新
    cmds:
      - task: outdated:tools

  outdated:tools:
    desc: 更新工具
    cmds:
      - mise outdated

  upgrade:
    desc: 升级
    cmds:
      - task: upgrade:tools

  upgrade:tools:
    desc: 升级工具
    cmds:
      - mise upgrade --locked

  check:
    desc: 检查
    cmds:
      - task: check:validate
      - task: check:format
      - task: check:spell

  check:validate:
    desc: 校验检查
    cmds:
      - validator .

  check:format:
    desc: 格式检查
    cmds:
      - dprint check --allow-no-files

  check:spell:
    desc: 拼写检查
    cmds:
      - typos --force-exclude

  check:secret:
    desc: 密钥检查
    cmds:
      - trivy fs --scanners secret --exit-code 1 .

  check:audit:
    desc: 安全检查
    cmds:
      - trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 .

  check:openapi:
    desc: 契约检查
    dir: contracts/http
    cmds:
      - vacuum lint --ruleset vacuum.yaml openapi.yaml

  check:compat:
    desc: 兼容性检查
    dir: contracts/http
    shell: bash -c
    cmds:
      - git show origin/main:contracts/http/openapi.yaml 2>/dev/null | oasdiff breaking --fail-on ERR - openapi.yaml

  format:
    desc: 格式化
    cmds:
      - task: format:config

  format:config:
    desc: 配置格式
    cmds:
      - dprint fmt

  stack:up:
    desc: 编排启动
    cmds:
      - process-compose up -t=false --env infra/.env

  stack:down:
    desc: 编排停止
    dir: infra
    cmds:
      - process-compose down

  stack:verify:
    desc: 编排验收
    dir: infra
    cmds:
      - hurl --test --variables-file .env test.hurl
