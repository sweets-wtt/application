# 版本
version: "3"

# 执行环境
shell:
  # 默认 shell
  default:
    # 执行器
    cmd: mise
    # 参数
    args: ["exec", "--", "bash", "-cu"]

# 输出模式
output: prefixed

# 变量
vars:
  # uv 命令
  UV: uv run --locked
  # 前端文件匹配
  WEB_FILES: "'**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,vue,html,css}'"
  # 编排命令
  COMPOSE: docker compose -f infra/compose.yaml -p application
  # 契约制品
  SPEC: contracts/http/dist/openapi.yaml
  # Python 模型
  PYTHON_MODELS: apps/server/src/server/generated/contracts.py
  # 契约生成物
  GENERATED: "{{.PYTHON_MODELS}} apps/web/src/api/generated/http apps/web/src/api/generated/schemas contracts/http/dist"
  # 镜像前缀
  REGISTRY: '{{.REGISTRY | default ""}}'
  # 镜像标签
  TAG: '{{.TAG | default "latest"}}'

# 任务
tasks:
  default:
    desc: 列出任务
    aliases: [list]
    cmds:
      - task --list

  install:
    desc: 安装
    cmds:
      - task: install-tools
      - task: install-python
      - task: install-typescript

  install-tools:
    desc: 安装工具链
    cmds:
      - mise install --locked

  install-python:
    desc: 安装 Python 依赖
    cmds:
      - uv sync --locked

  install-typescript:
    desc: 安装 TypeScript 依赖
    cmds:
      - bun install --frozen-lockfile

  check:
    desc: 检查
    deps:
      - check-format
      - check-taskfile
      - check-spell
      - check-secret
      - check-github
      - check-compose
      - check-python
      - check-typescript
      - check-api

  check-taskfile:
    desc: 检查任务文件
    silent: true
    cmds:
      - task --list-all > /dev/null

  check-format:
    desc: 检查文件格式
    cmds:
      - dprint check

  check-spell:
    desc: 检查拼写
    cmds:
      - typos

  check-secret:
    desc: 检测泄露密钥
    cmds:
      - gitleaks git

  check-github:
    desc: 校验 GitHub 工作流
    cmds:
      # 语法检查
      - actionlint
      # 安全审计
      - zizmor --strict-collection .github

  check-api:
    desc: 校验 OpenAPI 契约
    cmds:
      - vacuum lint --ruleset contracts/ruleset.yaml --min-score 95 {{.SPEC}}

  check-compose:
    desc: 校验容器编排配置
    cmds:
      - "{{.COMPOSE}} config --quiet"

  check-python:
    desc: 检查 Python
    cmds:
      # 格式检查
      - "{{.UV}} ruff format --check ."
      # 静态检查
      - "{{.UV}} ruff check ."
      # 类型检查
      - "{{.UV}} ty check ."

  check-typescript:
    desc: 检查 TypeScript
    deps:
      - build-types
    cmds:
      # 格式检查
      - bunx oxfmt --check --no-error-on-unmatched-pattern {{.WEB_FILES}}
      # 静态检查
      - bunx oxlint --no-error-on-unmatched-pattern

  build-types:
    desc: 生成组件类型声明
    internal: true
    silent: true
    # 工作目录
    dir: apps/web
    # 源文件
    sources:
      - "src/**/*.{ts,tsx,vue}"
      - vite.config.ts
      - tsconfig.json
    # 生成物
    generates:
      - components.d.ts
    cmds:
      - bun run build

  format:
    desc: 格式化
    deps:
      - format-code
      - format-python
      - format-typescript

  format-code:
    desc: 格式化配置与文档
    cmds:
      - dprint fmt

  format-python:
    desc: 格式化 Python
    cmds:
      # 格式化
      - "{{.UV}} ruff format ."
      # 自动修复
      - "{{.UV}} ruff check --fix ."

  format-typescript:
    desc: 格式化 TypeScript
    cmds:
      # 自动修复
      - bunx oxlint --fix --no-error-on-unmatched-pattern
      # 格式化
      - bunx oxfmt --no-error-on-unmatched-pattern {{.WEB_FILES}}

  build:
    desc: 构建
    cmds:
      - task: build-web

  build-web:
    desc: 构建 Web
    cmds:
      - bun run --filter @app/web build

  build-image:
    desc: 构建应用镜像
    deps:
      - build-image-server
      - build-image-web

  build-image-web:
    desc: 构建 Web 镜像
    cmds:
      - docker build -f apps/web/Dockerfile -t {{.REGISTRY}}web:{{.TAG}} .

  build-image-server:
    desc: 构建 Server 镜像
    cmds:
      - docker build -f apps/server/Dockerfile -t {{.REGISTRY}}server:{{.TAG}} .

  check-size:
    desc: 检查产物体积
    cmds:
      - task: build-web
      - bun run --filter @app/web size

  test:
    desc: 测试
    cmds:
      - task: test-python
      - task: test-typescript

  test-python:
    desc: 测试 Python
    dir: apps/server
    cmds:
      - "{{.UV}} pytest"

  test-typescript:
    desc: 测试 Web
    cmds:
      - bun run --filter @app/* test

  test-e2e:
    desc: 测试端到端
    dir: apps/web
    cmds:
      - task: build-web
      # 端到端测试
      - bunx playwright test

  bundle-spec:
    desc: 打包契约
    # 执行次数
    run: once
    cmds:
      # 打包契约
      - vacuum bundle --composed --base contracts/http -q contracts/http/openapi.yaml {{.SPEC}} > /dev/null
      # 写入生成标记
      - task: bundle-stamp

  bundle-stamp:
    internal: true
    silent: true
    cmds:
      - |
        uv run --locked python - <<'PY'
        from pathlib import Path

        # 首行标记
        path = Path("{{.SPEC}}")
        header = "# Generated by task bundle - do not edit manually\n"
        path.write_text(header + path.read_text(encoding="utf-8"), encoding="utf-8", newline="\n")
        PY

  codegen:
    desc: 生成契约
    cmds:
      - task: codegen-python
      - task: codegen-typescript

  codegen-python:
    desc: 生成 Python 模型
    cmds:
      - task: bundle-spec
      # 生成模型
      - "{{.UV}} datamodel-codegen --input {{.SPEC}} --output {{.PYTHON_MODELS}} --disable-timestamp --openapi-scopes paths --strict-types int --formatters black isort"
      # 统一换行
      - task: codegen-py-normalize

  codegen-py-normalize:
    internal: true
    silent: true
    cmds:
      - |
        uv run --locked python - <<'PY'
        from pathlib import Path

        # CRLF 转 LF
        path = Path("{{.PYTHON_MODELS}}")
        path.write_bytes(path.read_bytes().replace(b"\r\n", b"\n"))
        PY

  codegen-typescript:
    desc: 生成 TypeScript 客户端
    dir: apps/web
    cmds:
      - task: bundle-spec
      # 生成客户端
      - bunx orval
      # 格式化生成物
      - bunx oxfmt src/api/generated

  check-codegen:
    desc: 检查契约漂移
    cmds:
      - task: codegen
      - git diff --exit-code -- {{.GENERATED}}

  scan-vuln:
    desc: 扫描漏洞
    cmds:
      - trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 .

  ci:
    desc: 运行 CI
    deps:
      - check
      - scan-vuln

  install-hooks:
    desc: 安装钩子
    cmds:
      - lefthook install

  check-commit:
    desc: 校验提交信息
    cmds:
      - cog verify {{.CLI_ARGS}}

  compose-up:
    desc: 启动本地服务
    cmds:
      - "{{.COMPOSE}} up -d --remove-orphans --wait"

  compose-down:
    desc: 停止本地服务
    cmds:
      - "{{.COMPOSE}} down --remove-orphans"
