# 任务
version: "3"

# 任务
tasks:
  install:
    desc: 安装
    cmds:
      - task: install:tools
      - task: install:hooks
      - task: install:python
      - task: install:typescript

  install:tools:
    desc: 安装工具
    cmds:
      - mise install --locked

  install:hooks:
    desc: 安装钩子
    cmds:
      - lefthook install

  install:python:
    desc: 安装 Python 依赖
    cmds:
      - uv sync --locked --all-packages --all-extras

  install:typescript:
    desc: 安装 TypeScript 依赖
    cmds:
      - bun install --frozen-lockfile

  outdated:
    desc: 更新
    cmds:
      - task: outdated:tools

  outdated:tools:
    desc: 更新工具
    cmds:
      - mise outdated

  upgrade:
    desc: 升级
    cmds:
      - task: upgrade:tools

  upgrade:tools:
    desc: 升级工具
    cmds:
      - mise upgrade --locked

  check:
    desc: 检查
    cmds:
      - task: check:validate
      - task: check:format
      - task: check:spell
      - task: check:python
      - task: check:typescript

  check:validate:
    desc: 校验检查
    cmds:
      - validator .

  check:format:
    desc: 格式检查
    cmds:
      - dprint check --allow-no-files

  check:spell:
    desc: 拼写检查
    cmds:
      - typos --force-exclude

  check:secret:
    desc: 密钥检查
    cmds:
      - trivy fs --scanners secret --exit-code 1 .

  check:audit:
    desc: 安全检查
    cmds:
      - trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 .

  check:openapi:
    desc: 契约检查
    dir: contracts/http
    cmds:
      - vacuum lint --ruleset vacuum.yaml openapi.yaml

  check:compat:
    desc: 兼容性检查
    dir: contracts/http
    shell: bash -c
    cmds:
      - git show origin/main:contracts/http/openapi.yaml 2>/dev/null | oasdiff breaking --fail-on ERR - openapi.yaml

  check:python:
    desc: Python 检查
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - uv run ty check .

  check:typescript:
    desc: TypeScript 检查
    cmds:
      - bunx oxfmt --check --no-error-on-unmatched-pattern '**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
      - bunx oxlint --no-error-on-unmatched-pattern
      - bunx tsc -b --noEmit

  format:
    desc: 格式化
    cmds:
      - task: format:config
      - task: format:python
      - task: format:typescript

  format:config:
    desc: 配置格式
    cmds:
      - dprint fmt

  format:python:
    desc: Python 格式化
    cmds:
      - uv run ruff format .

  format:typescript:
    desc: TypeScript 格式化
    cmds:
      - bunx oxfmt --no-error-on-unmatched-pattern '**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'

  stack:up:
    desc: 编排启动
    cmds:
      - process-compose up -t=false --env infra/.env

  stack:down:
    desc: 编排停止
    dir: infra
    cmds:
      - process-compose down

  stack:verify:
    desc: 编排验收
    dir: infra
    cmds:
      - hurl --test --variables-file .env test.hurl
