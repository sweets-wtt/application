# 任务
version: "3"

# 任务
tasks:
  install:
    desc: 安装
    cmds:
      - task: install:tools
      - task: install:hooks

  install:tools:
    desc: 安装工具
    cmds:
      - mise install --locked

  install:hooks:
    desc: 安装钩子
    cmds:
      - lefthook install

  outdated:
    desc: 更新
    cmds:
      - task: outdated:tools

  outdated:tools:
    desc: 更新工具
    cmds:
      - mise outdated

  upgrade:
    desc: 升级
    cmds:
      - task: upgrade:tools

  upgrade:tools:
    desc: 升级工具
    cmds:
      - mise upgrade --locked

  check:
    desc: 检查
    cmds:
      - task: check:validate
      - task: check:format
      - task: check:spell

  check:validate:
    desc: 校验检查
    cmds:
      - validator .

  check:format:
    desc: 格式检查
    cmds:
      - dprint check --allow-no-files

  check:spell:
    desc: 拼写检查
    cmds:
      - typos --force-exclude

  check:secret:
    desc: 密钥检查
    cmds:
      - trivy fs --scanners secret --exit-code 1 .

  check:audit:
    desc: 安全检查
    cmds:
      - trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 .

  format:
    desc: 格式化
    cmds:
      - task: format:config

  format:config:
    desc: 配置格式
    cmds:
      - dprint fmt
