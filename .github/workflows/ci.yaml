# 工作流名称
name: ci

# 触发条件
on:
  # 拉取请求
  pull_request:
  # 推送
  push:
    # 分支
    branches:
      - main

# 权限
permissions:
  # 内容权限
  contents: read

# 并发控制
concurrency:
  # 分组
  group: ${{ github.workflow }}-${{ github.ref }}
  # 取消进行中的运行
  cancel-in-progress: true

# 任务
jobs:
  # 代码检查
  lint:
    # 运行环境
    runs-on: ubuntu-latest
    # 超时分钟
    timeout-minutes: 15
    # 步骤
    steps:
      # 环境准备动作
      - uses: ./.github/actions/setup
        # 输入参数
        with:
          # 检出深度
          fetch-depth: 0
          # 环境文件
          env-file: false
      # 运行 CI
      - run: task ci

  # 测试
  test:
    # 运行环境
    runs-on: ubuntu-latest
    # 超时分钟
    timeout-minutes: 20
    # 步骤
    steps:
      # 环境准备动作
      - uses: ./.github/actions/setup
        # 输入参数
        with:
          # 检出深度
          fetch-depth: 0
      # 运行测试
      - run: task test
      # 检查产物体积
      - run: task check-size
      # 检查契约漂移
      - run: task check-codegen

  # 端到端测试
  e2e:
    # 运行环境
    runs-on: ubuntu-latest
    # 超时分钟
    timeout-minutes: 20
    # 步骤
    steps:
      # 环境准备动作
      - uses: ./.github/actions/setup
        # 输入参数
        with:
          # 依赖安装方式
          dependencies: bun
          # 环境文件
          env-file: false
      # 安装 Playwright 浏览器
      - run: mise exec -- bun x playwright install --with-deps chromium
      # 运行端到端测试
      - run: task test-e2e

  # 镜像构建
  images:
    # 运行环境
    runs-on: ubuntu-latest
    # 超时分钟
    timeout-minutes: 20
    # 步骤
    steps:
      # 环境准备动作
      - uses: ./.github/actions/setup
        # 输入参数
        with:
          # 环境文件
          env-file: false
          # 容器运行时
          container-runtime: "true"
      # 构建镜像
      - run: task build-image

  # API 兼容检查
  compat:
    # 运行条件
    if: github.event_name == 'pull_request'
    # 运行环境
    runs-on: ubuntu-latest
    # 超时分钟
    timeout-minutes: 10
    # 步骤
    steps:
      # 环境准备动作
      - uses: ./.github/actions/setup
        # 输入参数
        with:
          # 检出深度
          fetch-depth: 0
          # 依赖安装方式
          dependencies: none
          # 环境文件
          env-file: false
      # 对比契约基线
      - run: |
          if git cat-file -e "origin/main:contracts/http/dist/openapi.yaml" 2>/dev/null; then
            oasdiff breaking --fail-on ERR "origin/main:contracts/http/dist/openapi.yaml" contracts/http/dist/openapi.yaml
          else
            echo "基线制品缺失 - 跳过兼容检查"
          fi

  # 提交规范
  commit-lint:
    # 运行条件
    if: github.event_name == 'pull_request'
    # 运行环境
    runs-on: ubuntu-latest
    # 超时分钟
    timeout-minutes: 5
    # 步骤
    steps:
      # 环境准备动作
      - uses: ./.github/actions/setup
        # 输入参数
        with:
          # 检出深度
          fetch-depth: 0
          # 依赖安装方式
          dependencies: none
          # 环境文件
          env-file: false
      # 校验提交信息
      - env:
          # 基线提交
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          for sha in $(git rev-list --no-merges "$BASE"..HEAD); do
            git log -1 --format=%B "$sha" | mise exec -- cog verify --file - || exit 1
          done

  # 依赖审查
  deps-review:
    # 运行条件
    if: github.event_name == 'pull_request'
    # 运行环境
    runs-on: ubuntu-latest
    # 超时分钟
    timeout-minutes: 10
    # 步骤
    steps:
      # 环境准备动作
      - uses: ./.github/actions/setup
        # 输入参数
        with:
          # 依赖安装方式
          dependencies: none
          # 环境文件
          env-file: false
      # 审查依赖变更
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
