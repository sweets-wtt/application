# 工作流名称
name: ci

# 触发事件
on:
  # 拉取请求
  pull_request:
  # 推送
  push:
    # 分支
    branches:
      - main

# 令牌权限
permissions:
  # 内容
  contents: read

# 并发 - 同引用取消旧运行
concurrency:
  # 组
  group: ${{ github.workflow }}-${{ github.ref }}
  # 取消进行中
  cancel-in-progress: true

# 作业
jobs:
  # 代码检查
  lint:
    # 运行环境
    runs-on: ubuntu-latest
    # 超时
    timeout-minutes: 15
    # 步骤
    steps:
      # 环境准备 - 检查需全量历史
      - uses: ./.github/actions/setup
        with:
          fetch-depth: 0
          env-file: false
      # 检查与审计
      - run: mise exec -- just ci

  # 测试
  test:
    # 运行环境
    runs-on: ubuntu-latest
    # 超时
    timeout-minutes: 20
    # 步骤
    steps:
      # 环境准备
      - uses: ./.github/actions/setup
        with:
          fetch-depth: 0
      # 运行测试
      - run: mise exec -- just test
      # 体积预算检查（含构建）
      - run: mise exec -- just size
      # 契约生成物检查
      - run: mise exec -- just codegen-check

  # 端到端测试
  e2e:
    # 运行环境
    runs-on: ubuntu-latest
    # 超时
    timeout-minutes: 20
    # 步骤
    steps:
      # 环境准备 - 仅前端依赖
      - uses: ./.github/actions/setup
        with:
          dependencies: bun
          env-file: false
      # 浏览器安装
      - run: mise exec -- bun x playwright install --with-deps chromium
      # 运行端到端测试
      - run: mise exec -- just test-e2e

  # 镜像构建
  images:
    # 运行环境
    runs-on: ubuntu-latest
    # 超时
    timeout-minutes: 20
    # 步骤
    steps:
      # 环境准备
      - uses: ./.github/actions/setup
        with:
          env-file: false
      # 构建镜像
      - run: mise exec -- just build

  # 依赖更新配置校验
  renovate:
    # 运行环境
    runs-on: ubuntu-latest
    # 超时
    timeout-minutes: 5
    # 步骤
    steps:
      # 环境准备
      - uses: ./.github/actions/setup
        with:
          dependencies: none
          env-file: false
      # 运行时
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      # 配置校验
      - uses: suzuki-shunsuke/github-action-renovate-config-validator@ee9f69e1f683ed0d08225086482b34fc9abe9300 # v2.1.0
        # 输入
        with:
          # 配置路径
          config_file_path: renovate.jsonc

  # API 兼容检查
  compat:
    # 仅拉取请求
    if: github.event_name == 'pull_request'
    # 运行环境
    runs-on: ubuntu-latest
    # 超时
    timeout-minutes: 10
    # 步骤
    steps:
      # 环境准备 - 对比基线需全量历史
      - uses: ./.github/actions/setup
        with:
          fetch-depth: 0
          dependencies: none
          env-file: false
      # 破坏性变更检查 - 制品对比，基线缺失时跳过
      - run: |
          if git cat-file -e "origin/main:contracts/http/dist/openapi.yaml" 2>/dev/null; then
            oasdiff breaking --fail-on ERR "origin/main:contracts/http/dist/openapi.yaml" contracts/http/dist/openapi.yaml
          else
            echo "基线制品缺失 - 跳过兼容检查"
          fi

  # 提交规范
  commit-lint:
    # 仅拉取请求
    if: github.event_name == 'pull_request'
    # 运行环境
    runs-on: ubuntu-latest
    # 超时
    timeout-minutes: 5
    # 步骤
    steps:
      # 环境准备 - 校验提交需全量历史
      - uses: ./.github/actions/setup
        with:
          fetch-depth: 0
          dependencies: none
          env-file: false
      # 逐条校验提交信息
      - env:
          # 基点
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          for sha in $(git rev-list --no-merges "$BASE"..HEAD); do
            git log -1 --format=%B "$sha" | mise exec -- cog verify --file - || exit 1
          done

  # 依赖审查
  deps-review:
    # 仅拉取请求
    if: github.event_name == 'pull_request'
    # 运行环境
    runs-on: ubuntu-latest
    # 超时
    timeout-minutes: 10
    # 步骤
    steps:
      # 环境准备
      - uses: ./.github/actions/setup
        with:
          dependencies: none
          env-file: false
      # 依赖审查 - 漏洞与许可门禁
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
