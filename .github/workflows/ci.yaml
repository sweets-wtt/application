# GitHub Actions 持续集成 - https://docs.github.com/actions

# 工作流名称
name: ci

# 触发事件
on:
  # 拉取请求
  pull_request:
  # 推送
  push:
    # 分支
    branches:
      - main

# 令牌权限
permissions:
  # 内容
  contents: read

# 作业
jobs:
  # 代码检查
  lint:
    # 运行环境
    runs-on: ubuntu-latest
    # 步骤
    steps:
      # 检出仓库
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 动作输入
        with:
          # 检出深度
          fetch-depth: 0
          # 凭据保留
          persist-credentials: false
      # 环境管理
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        # 动作输入
        with:
          # 版本
          version: "2026.8.14"
      # 运行命令
      - run: moon run :lint
        # 环境变量
        env:
          # 持续集成标识
          CI: ""

  # 任务编排
  moon:
    # 运行环境
    runs-on: ubuntu-latest
    # 步骤
    steps:
      # 检出仓库
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 动作输入
        with:
          # 检出深度
          fetch-depth: 0
          # 凭据保留
          persist-credentials: false
      # 环境管理
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        # 动作输入
        with:
          # 版本
          version: "2026.8.14"
      # 运行命令
      - run: cog check
      # 运行命令
      - run: moon ci

  # 兼容检查
  oasdiff:
    # 运行条件
    if: github.event_name == 'pull_request'
    # 运行环境
    runs-on: ubuntu-latest
    # 步骤
    steps:
      # 检出仓库
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 动作输入
        with:
          # 检出深度
          fetch-depth: 0
          # 凭据保留
          persist-credentials: false
      # 环境管理
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        # 动作输入
        with:
          # 版本
          version: "2026.8.14"
      # 运行命令
      - run: |
          vacuum bundle --ruleset contracts/http/vacuum.yaml contracts/http/openapi.yaml /tmp/rev.yaml
          oasdiff breaking --fail-on ERR origin/main:contracts/http/openapi.yaml /tmp/rev.yaml
