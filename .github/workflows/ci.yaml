# 工作流名称
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同一引用取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 代码检查
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 全量历史供密钥扫描
      - uses: ./.github/actions/setup
        with:
          fetch-depth: 0
          env-file: false
      - run: mise run ci

  # 测试
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: ./.github/actions/setup
        with:
          fetch-depth: 0
      - run: mise run test
      # 体积预算（含前端构建）
      - run: mise run size
      # 契约生成物无漂移
      - run: mise run check:codegen

  # 端到端测试
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: ./.github/actions/setup
        with:
          dependencies: bun
          env-file: false
      - run: mise exec -- bun x playwright install --with-deps chromium
      - run: mise run test:e2e

  # 镜像构建
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: ./.github/actions/setup
        with:
          env-file: false
          container-runtime: "true"
      - run: mise run build:image

  # 依赖更新配置校验
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: ./.github/actions/setup
        with:
          dependencies: none
          env-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - uses: suzuki-shunsuke/github-action-renovate-config-validator@ee9f69e1f683ed0d08225086482b34fc9abe9300 # v2.1.0
        with:
          config_file_path: renovate.jsonc

  # API 兼容检查
  compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 对比基线需全量历史
      - uses: ./.github/actions/setup
        with:
          fetch-depth: 0
          dependencies: none
          env-file: false
      # 制品对比，基线缺失时跳过
      - run: |
          if git cat-file -e "origin/main:contracts/http/dist/openapi.yaml" 2>/dev/null; then
            oasdiff breaking --fail-on ERR "origin/main:contracts/http/dist/openapi.yaml" contracts/http/dist/openapi.yaml
          else
            echo "基线制品缺失 - 跳过兼容检查"
          fi

  # 提交规范
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 校验提交需全量历史
      - uses: ./.github/actions/setup
        with:
          fetch-depth: 0
          dependencies: none
          env-file: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          for sha in $(git rev-list --no-merges "$BASE"..HEAD); do
            git log -1 --format=%B "$sha" | mise exec -- cog verify --file - || exit 1
          done

  # 依赖审查
  deps-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup
        with:
          dependencies: none
          env-file: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
