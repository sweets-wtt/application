# 工作流名称
name: release

# 触发事件
on:
  # 手动触发
  workflow_dispatch:

# 令牌权限
permissions:
  # 内容
  contents: read

# 并发 - 同一时间只允许一次发版
concurrency:
  # 组
  group: release
  # 不取消进行中
  cancel-in-progress: false

# 作业
jobs:
  # 发版
  release:
    # 仅手动触发
    if: github.event_name == 'workflow_dispatch'
    # 运行环境
    runs-on: ubuntu-latest
    # 令牌权限
    permissions:
      # 内容
      contents: write
      # 镜像包
      packages: write
    # 作业输出
    outputs:
      # 标签
      tag: ${{ steps.tag.outputs.tag }}
    # 步骤
    steps:
      # 检出仓库
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 输入
        with:
          # 检出深度
          fetch-depth: 0
          # 凭据保留 - 推送改用显式令牌
          persist-credentials: false
      # 环境管理 - 发版不缓存
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        # 输入
        with:
          # 版本
          version: "2026.8.14"
          # 缓存
          cache: false
      # 提交身份
      - run: git config user.name 'github-actions[bot]'
      - run: git config user.email 'github-actions[bot]@users.noreply.github.com'
      # 自动版本
      - run: cog bump --auto
      # 读取标签
      - id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      # 推送分支与标签 - 显式令牌认证（凭据不持久化）
      - env:
          # 仓库令牌
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 仓库全名
          GH_REPO: ${{ github.repository }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}" main --tags
      # 登录镜像仓库
      - env:
          # 镜像仓库令牌
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 镜像仓库用户
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      # 构建器
      - run: docker buildx create --name ci --driver docker-container --use
      # 构建并推送镜像
      - env:
          # 镜像仓库地址
          REGISTRY: ghcr.io/${{ github.repository_owner }}/
          # 镜像标签
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker buildx bake -f docker-bake.hcl --push apps
