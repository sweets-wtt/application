# 工作流名称
name: release

# 触发条件
on:
  # 手动触发
  workflow_dispatch:

# 权限
permissions:
  # 内容
  contents: read

# 并发控制
concurrency:
  # 分组
  group: release
  # 取消进行中
  cancel-in-progress: false

# 任务
jobs:
  # 发版
  release:
    # 运行条件
    if: github.event_name == 'workflow_dispatch'
    # 运行环境
    runs-on: ubuntu-latest
    # 权限
    permissions:
      # 内容写入
      contents: write
      # 包写入
      packages: write
    # 输出
    outputs:
      # 版本标签
      tag: ${{ steps.tag.outputs.tag }}
    # 步骤
    steps:
      # 检出仓库
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 输入参数
        with:
          # 检出深度
          fetch-depth: 0
          # 持久化凭据
          persist-credentials: false
      # 安装工具链
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        # 输入参数
        with:
          # 工具版本
          version: "2026.8.14"
          # 启用缓存
          cache: false
      # 安装容器运行时
      - run: sudo apt-get update && sudo apt-get install -y podman podman-compose
      # 配置提交者名称
      - run: git config user.name 'github-actions[bot]'
      # 配置提交者邮箱
      - run: git config user.email 'github-actions[bot]@users.noreply.github.com'
      # 生成版本标签
      - run: cog bump --auto
      # 读取版本标签
      - id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      # 推送标签
      - env:
          # 令牌
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 仓库
          GH_REPO: ${{ github.repository }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}" main --tags
      # 登录镜像仓库
      - env:
          # 令牌
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 用户
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GHCR_USER" --password-stdin
      # 构建并推送镜像
      - env:
          # 镜像仓库
          REGISTRY: ghcr.io/${{ github.repository_owner }}/
          # 镜像标签
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          task build-image
          podman push "${REGISTRY}server:${TAG}"
          podman push "${REGISTRY}web:${TAG}"
