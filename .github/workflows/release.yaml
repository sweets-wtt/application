# 工作流名称
name: release

# 手动触发
on:
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只允许一次发版
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 推送改用显式令牌，凭据不持久化
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.8.14"
          # 发版不缓存
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y podman podman-compose
      - run: git config user.name 'github-actions[bot]'
      - run: git config user.email 'github-actions[bot]@users.noreply.github.com'
      # 自动版本
      - run: cog bump --auto
      - id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}" main --tags
      - env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GHCR_USER" --password-stdin
      - env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mise run build:image
          podman push "${REGISTRY}server:${TAG}"
          podman push "${REGISTRY}web:${TAG}"
