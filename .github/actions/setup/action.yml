# 动作名称
name: setup
# 动作说明
description: 检出仓库并准备工具链、依赖与环境变量

inputs:
  fetch-depth:
    description: 检出深度
    default: "1"
  dependencies:
    description: 依赖安装方式（all | bun | none）
    default: all
  env-file:
    description: 是否生成 infra/.env
    default: "true"
  container-runtime:
    description: 是否安装 podman
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false
    # 环境管理（版本号唯一来源）
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      with:
        version: "2026.8.14"
    # 全量依赖（mise + uv + bun）
    - if: inputs.dependencies == 'all'
      run: just install
      shell: bash
    # 容器运行时
    - if: inputs.container-runtime == 'true'
      run: sudo apt-get update && sudo apt-get install -y podman podman-compose
      shell: bash
    # 前端依赖
    - if: inputs.dependencies == 'bun'
      run: mise exec -- bun install --frozen-lockfile
      shell: bash
    # 环境变量文件（compose 校验用）
    - if: inputs.env-file == 'true'
      run: sed 's/=$/=placeholder/' infra/.env.example > infra/.env
      shell: bash
