# pyproject.toml - https://packaging.python.org/en/latest/specifications/pyproject-toml/

# 项目
[project]
# 名称
name = "application"
# 版本
version = "0.1.0"
# 要求 Python
requires-python = ">=3.12"

# uv 工作区
[tool.uv.workspace]
# 成员
members = ["packages/python/*"]

# 依赖组
[dependency-groups]
# 开发
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.0",
  "ruff>=0.16.6",
  "ty>=0.0.78",
]

# Ruff - https://docs.astral.sh/ruff/
[tool.ruff]
# 扩展排除
extend-exclude = ["packages/python/contracts/src/app/contracts/generated"]

[tool.ruff.lint]
# 规则集
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
  "ASYNC",
  "DTZ",
  "FA",
  "PERF",
  "TC",
]

# ty - https://docs.astral.sh/ty/
[tool.ty.analysis]
# 严格等式比较
strict-equality-semantics = true
# 严格泛型窄化
strict-generic-narrowing = true

# pytest - https://docs.pytest.org/
[tool.pytest.ini_options]
# 附加参数 importlib 允许非包目录下同名测试模块共存
addopts = "--strict-markers --strict-config --cov --cov-branch --import-mode=importlib"
# asyncio 模式
asyncio_mode = "auto"

# coverage - https://coverage.readthedocs.io/
[tool.coverage.run]
# 分支覆盖
branch = true
