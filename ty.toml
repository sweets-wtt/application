# 分析
[analysis]
# 返回类型推断
return-type-inference = "always"
# 严格相等
strict-equality-semantics = true
# 严格泛型窄化
strict-generic-narrowing = true

# 运行环境
[environment]
# 目标平台
python-platform = "linux"
# Python 版本
python-version = "3.12"

# 源码
[src]
# 排除目录
exclude = [
  # 字节码缓存
  "**/__pycache__",
  # 契约生成物
  "apps/server/src/server/generated",
]
# 源码根
include = ["apps/server/src", "apps/server/tests"]

# 终端
[terminal]
# 警告即失败
error-on-warning = true
# 输出格式
output-format = "full"

# 规则
[rules]
# 全部规则
all = "error"
# Protocol 歧义
ambiguous-protocol-member = "warn"
# 笼统 ignore
blanket-ignore-comment = "ignore"
# 冲突声明
conflicting-declarations = "ignore"
# 已弃用
deprecated = "warn"
# 装饰器返回动态类型
dynamic-function-decorator-return = "warn"
# 实验性语法
experimental-syntax = "warn"
# 未知规则 ignore
ignore-comment-unknown-rule = "ignore"
# 无效声明
invalid-declaration = "ignore"
# 语法错误 ignore
invalid-ignore-comment = "ignore"
# 旧式位置参数
invalid-legacy-positional-parameter = "warn"
# 未声明依赖
missing-direct-dependency = "ignore"
# 可能缺属性
possibly-missing-attribute = "warn"
# 可能缺隐式调用
possibly-missing-implicit-call = "warn"
# 可能缺导入
possibly-missing-import = "warn"
# 可能缺子模块
possibly-missing-submodule = "warn"
# 可能未定义引用
possibly-unresolved-reference = "ignore"
# 可调用真值判断
truthiness-test-of-callable = "warn"
# 可迭代真值判断
truthiness-test-of-iterable = "warn"
# None 联合真值判断
truthiness-test-of-none-union = "warn"
# 未绑定 global
unresolved-global = "ignore"
# 未定义引用
unresolved-reference = "ignore"
# 不健全赋值
unsound-assignment = "warn"
# 不健全 yield
unsound-yield = "warn"
# 不支持的基类
unsupported-base = "warn"
# 动态基类不支持
unsupported-dynamic-base = "warn"
# 失效 ignore
unused-ignore-comment = "ignore"
# 失效 type ignore
unused-type-ignore-comment = "ignore"
