# 分析配置
[analysis]
# 严格等式比较
strict-equality-semantics = true
# 严格泛型窄化
strict-generic-narrowing = true

# 源码范围
[src]
# 排除契约生成物
exclude = ["apps/server/src/server/generated"]

# 运行环境
[environment]
# 目标 Python 版本 - 与根 .python-version 一致
python-version = "3.12"

# 终端输出
[terminal]
# 警告视为失败, 保证 CI 阻断
error-on-warning = true

# 规则
[rules]
# 全面 ignore 注释
blanket-ignore-comment = "error"
# cast 到不相交类型
disjoint-cast = "error"
# 除零
division-by-zero = "error"
# 覆写缺 @override
missing-override-decorator = "error"
