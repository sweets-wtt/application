# 最近标签起点
from_latest_tag = true
# 忽略合并提交
ignore_merge_commits = true
# 标签前缀
tag_prefix = "v"

# 更新日志
[changelog]
# 仓库所有者
owner = "sweets-wtt"
# 输出路径
path = "CHANGELOG.md"
# 远端主机
remote = "github.com"
# 仓库名
repository = "application"
# 模板
template = "remote"

# 提交类型
[commit_types]
# 构建
build = { omit_from_changelog = true }
# 杂项
chore = { omit_from_changelog = true }
# 持续集成
ci = { omit_from_changelog = true }
# 文档
docs = { omit_from_changelog = true }
# 新功能
feat = { changelog_title = "Features" }
# 缺陷修复
fix = { changelog_title = "Bug Fixes" }
# 性能优化
perf = { changelog_title = "Performance" }
# 重构
refactor = { changelog_title = "Refactors" }
# 回滚
revert = { changelog_title = "Reverts" }
# 风格
style = { omit_from_changelog = true }
# 测试
test = { omit_from_changelog = true }
