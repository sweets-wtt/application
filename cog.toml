# cocogitto - `https://docs.cocogitto.io/`

# 标签前缀
tag_prefix = "v"

# 从最新标签起
from_latest_tag = true

# 忽略合并提交
ignore_merge_commits = true

# 发版前钩子
pre_bump_hooks = [
  # 写版本清单
  "echo {\".\": \"{{version}}\"} > .release-please-manifest.json",
]

# 更新日志
[changelog]
# 模板
template = "remote"
# 路径
path = "CHANGELOG.md"
# 远程
remote = "github.com"
# 所有者
owner = "sweets-wtt"
# 仓库名
repository = "application"

# 提交类型
[commit_types]
