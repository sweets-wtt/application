# Docker Compose - https://docs.docker.com/compose/

# 服务
services:
  # PostgreSQL
  postgresql:
    # 镜像
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    # 重启策略
    restart: unless-stopped
    # 启动命令（官方：-c 指定配置与 HBA 文件）
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    # 环境变量
    environment:
      # 超管口令（官方：_FILE 后缀从密钥文件读取）
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      # 应用角色口令（init.sql 经 psql \getenv 读取）
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      # Hatchet 角色口令
      HATCHET_DB_PASSWORD: ${HATCHET_DB_PASSWORD:?}
    # 密钥
    secrets:
      # 超管口令
      - "postgres-password"
    # 数据卷
    volumes:
      # 数据目录（官方 PG 18：/var/lib/postgresql）
      - "postgresql-data:/var/lib/postgresql"
      # 初始化脚本（官方：数据目录为空时执行）
      - "./init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
      # 配置文件
      - "./postgresql.conf:/etc/postgresql/postgresql.conf:ro"
      - "./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro"
    # 健康检查
    healthcheck:
      # 就绪探测
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      # 间隔
      interval: "10s"
      # 超时
      timeout: "5s"
      # 重试次数
      retries: 5
      # 启动宽限期
      start_period: "30s"
    # 网络
    networks:
      # 数据内部网
      - "data-internal"
