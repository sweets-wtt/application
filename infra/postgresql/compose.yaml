# Docker Compose - `https://docs.docker.com/compose/`

# 服务
services:
  # PostgreSQL
  postgresql:
    # 镜像
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    # 重启策略
    restart: unless-stopped
    # 启动命令
    command: "postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf"
    # 环境变量
    environment:
      # 口令
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
      # 应用口令
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    # 密钥
    secrets:
      # 口令
      - "postgres"
    # 数据卷
    volumes:
      # 数据目录
      - "postgresql-data:/var/lib/postgresql"
      # 初始化脚本
      - "./init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
      # 配置文件
      - "./postgresql.conf:/etc/postgresql/postgresql.conf:ro"
      - "./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro"
    # 健康检查
    healthcheck:
      # 就绪探测
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      # 间隔
      interval: "10s"
      # 超时
      timeout: "5s"
      # 重试次数
      retries: 5
      # 启动宽限期
      start_period: "30s"
    # 网络
    networks:
      # 数据内部网
      - "data-internal"

  # PostgreSQL 备份
  postgresql-backup:
    # 镜像
    image: "restic/restic@sha256:4cf4a61ef9786f4de53e9de8c8f5c040f33830eb0a10bf3d614410ee2fcb6120"
    # 重启策略
    restart: unless-stopped
    # 配置档
    profiles: ["backup"]
    # 环境变量
    environment:
      # 仓库路径
      RESTIC_REPOSITORY: /srv/repo
      # 仓库口令
      RESTIC_PASSWORD: "${RESTIC_PASSWORD:?}"
      # 口令
      PGPASSWORD: "${POSTGRES_PASSWORD:?}"
    # 卷
    volumes:
      # 仓库
      - "postgresql-repo:/srv/repo"
    # 入口
    entrypoint: ["sh", "-c"]
    # 启动命令
    command:
      - |
        restic snapshots --json >/dev/null 2>&1 || restic init -q
        while true; do
          pg_dump -h postgresql -U postgres -d postgres | restic backup --stdin --stdin-filename postgresql.sql --host postgresql
          sleep 3600
        done
    # 网络
    networks:
      # 数据内部网
      - "data-internal"
    # 依赖
    depends_on:
      # PostgreSQL
      postgresql:
        # 条件
        condition: "service_healthy"
