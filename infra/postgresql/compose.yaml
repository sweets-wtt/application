# Docker Compose - `https://docs.docker.com/compose/`

# 服务
services:
  # PostgreSQL
  postgresql:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    command: "postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf"
    environment:
      # 口令文件路径
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
      # 应用口令
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    secrets:
      - "postgres"
    volumes:
      # 数据目录
      - "postgresql-data:/var/lib/postgresql"
      # 初始化脚本
      - "./init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
      # 配置文件
      - "./postgresql.conf:/etc/postgresql/postgresql.conf:ro"
      - "./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro"
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "30s"
    networks:
      # 数据内部网
      - "data-internal"

  # PostgreSQL 备份
  postgresql-backup:
    image: "restic/restic@sha256:4cf4a61ef9786f4de53e9de8c8f5c040f33830eb0a10bf3d614410ee2fcb6120"
    restart: unless-stopped
    # 备份档
    profiles: ["backup"]
    environment:
      # 仓库路径
      RESTIC_REPOSITORY: /srv/repo
      # 仓库口令
      RESTIC_PASSWORD: "${RESTIC_PASSWORD:?}"
      # 口令
      PGPASSWORD: "${POSTGRES_PASSWORD:?}"
    volumes:
      # 备份仓库
      - "postgresql-repo:/srv/repo"
    # 启动命令（每小时全量导出）
    command:
      - "sh"
      - "-c"
      - |
        restic snapshots --json >/dev/null 2>&1 || restic init -q
        while true; do
          pg_dump -h postgresql -U postgres -d postgres | restic backup --stdin --stdin-filename postgresql.sql --host postgresql
          sleep 3600
        done
    networks:
      # 数据内部网
      - "data-internal"
    depends_on:
      postgresql:
        condition: "service_healthy"
