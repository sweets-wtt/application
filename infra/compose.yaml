# Docker Compose - `https://docs.docker.com/compose/`

# 项目名
name: application

# 引入
include:
  - "postgresql/compose.yaml"
  - "pgbouncer/compose.yaml"
  - "valkey/compose.yaml"
  - "garage/compose.yaml"
  - "hatchet/compose.yaml"
  - "authentik/compose.yaml"
  - "observe/compose.yaml"
  - "traefik/compose.yaml"

# 网络
networks:
  edge:
  app-internal:
    internal: true
  data-internal:
    internal: true
  management:
    internal: true
  egress:

# 卷
volumes:
  postgresql-data:
  postgresql-repo:
  valkey-data:
  garage-data:
  garage-repo:
  hatchet-config:
  authentik-data:
  openobserve-data:
  collector-storage:
  traefik-acme:

# 密钥
secrets:
  postgres:
    environment: POSTGRES_PASSWORD
  hatchet-master-keyset:
    environment: HATCHET_MASTER_KEYSET
  hatchet-jwt-public-keyset:
    environment: HATCHET_JWT_PUBLIC_KEYSET
  hatchet-jwt-private-keyset:
    environment: HATCHET_JWT_PRIVATE_KEYSET
