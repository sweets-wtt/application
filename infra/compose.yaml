# Docker Compose - `https://docs.docker.com/compose/`

# 项目名
name: application

# 引入
include:
  - "postgresql/compose.yaml"

# 网络
networks:
  edge:
  app-internal:
    internal: true
  data-internal:
    internal: true
  management:
    internal: true
  egress:

# 卷
volumes:
  postgresql-data:
  postgresql-repo:

# 密钥
secrets:
  postgres:
    environment: POSTGRES_PASSWORD
