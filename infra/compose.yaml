# 项目名
name: application

networks:
  # 入口网（Caddy / Web）
  edge:
  # 内部网（其余服务）
  internal:

volumes:
  caddy-data:

# 服务公共字段
x-service: &service
  restart: unless-stopped
  # 日志写入宿主机 systemd journal
  logging:
    driver: journald

# 健康检查参数
x-healthcheck: &healthcheck
  interval: "10s"
  timeout: "5s"
  retries: 5
  start_period: "30s"

x-internal: &internal
  - "internal"

services:
  # ── 平台 ─────────────────────────
  caddy:
    <<: *service
    image: "caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e"
    environment:
      AUTH_DOMAIN: "${AUTH_DOMAIN:?}"
      ACME_EMAIL: "${ACME_EMAIL:?}"
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3
      - "443:443/udp"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy-data:/data"
    healthcheck:
      <<: *healthcheck
      # 管理接口已关闭，改为校验二进制可用
      test: ["CMD", "caddy", "version"]
    networks:
      - "edge"

  # ── 应用 ─────────────────────────

  api:
    <<: *service
    image: "${SERVER_IMAGE:-server:latest}"
    healthcheck:
      <<: *healthcheck
      test: [
        "CMD-SHELL",
        "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\"",
      ]
    networks: *internal

  web:
    <<: *service
    image: "${WEB_IMAGE:-web:latest}"
    build:
      context: ".."
      dockerfile: "apps/web/Dockerfile"
      # VITE_* 为构建时注入
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
        VITE_HEARTBEAT_INTERVAL: "${VITE_HEARTBEAT_INTERVAL:-}"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q app"]
      start_period: "10s"
    networks:
      - "edge"
      - "internal"
    depends_on:
      api:
        condition: "service_healthy"
