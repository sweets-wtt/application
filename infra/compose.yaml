# 项目名
name: application

# 命名网络
networks:
  # 入口网
  edge:
  # 内部网
  internal:

# 命名卷
volumes:
  # PostgreSQL 数据
  postgresql-data:
  # PostgreSQL 仓库
  postgresql-repo:
  # Valkey 数据
  valkey-data:
  # Garage 数据
  garage-data:
  # Garage 仓库
  garage-repo:
  # OpenObserve 数据
  openobserve-data:
  # Collector 存储
  collector-storage:
  # Traefik 证书
  traefik-acme:

# 服务公共字段
x-service: &service # 重启策略
  restart: unless-stopped

# 健康检查参数
x-healthcheck: &healthcheck # 间隔
  interval: "10s"
  # 超时
  timeout: "5s"
  # 重试次数
  retries: 5
  # 启动宽限期
  start_period: "30s"

# 内部网
x-internal: &internal # 内部网
  - "internal"

# API 共享环境变量
x-environment: &environment # 数据源名称 - 单机直连,无独立连接池
  APP_DATABASE__URL: "postgresql+asyncpg://app:${POSTGRES_APP_PASSWORD}@postgresql:5432/app"
  # 对象存储端点地址
  APP_STORAGE__ENDPOINT_URL: "http://garage:3900"
  # 对象存储访问密钥
  APP_STORAGE__ACCESS_KEY_ID: "${GARAGE_S3_ACCESS_KEY:?}"
  # 对象存储秘密密钥
  APP_STORAGE__SECRET_ACCESS_KEY: "${GARAGE_S3_SECRET_KEY:?}"
  # 对象存储区域
  APP_STORAGE__REGION_NAME: "garage"
  # 对象存储桶名
  APP_STORAGE__BUCKET: "${GARAGE_DEFAULT_BUCKET:?}"
  # 缓存地址
  APP_CACHE__URL: "valkey://app:${VALKEY_APP_PASSWORD:?}@valkey:6379/0"
  # 工作流令牌
  APP_WORKFLOW__TOKEN: "${HATCHET_CLIENT_TOKEN:?}"
  # 工作流服务地址
  APP_WORKFLOW__SERVER_URL: "http://hatchet-lite:7077"
  # Hatchet TLS 策略
  HATCHET_CLIENT_TLS_STRATEGY: "none"
  # OTLP 端点
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4318"
  # OTLP 追踪端点
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://collector:4318/v1/traces"
  # OTLP 指标端点
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://collector:4318/v1/metrics"
  # 追踪导出器
  OTEL_TRACES_EXPORTER: "otlp"
  # 指标导出间隔
  OTEL_METRIC_EXPORT_INTERVAL: "5000"

# 服务
services:
  # ── 数据 ─────────────────────────

  # PostgreSQL
  postgresql:
    # 公共字段
    <<: *service
    # 镜像
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    # 启动命令 - 非默认日志项经 -c 注入(镜像默认已监听全部地址)
    command: [
      "postgres",
      "-c",
      "log_connections=on",
      "-c",
      "log_disconnections=on",
      "-c",
      "log_line_prefix=%m [%p] %q%u@%d ",
    ]
    # 环境变量
    environment:
      # 口令
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # 应用口令
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      # Authelia 口令
      POSTGRES_AUTHELIA_PASSWORD: ${POSTGRES_AUTHELIA_PASSWORD:?}
    # 数据卷
    volumes:
      # 数据目录
      - "postgresql-data:/var/lib/postgresql"
      # 初始化脚本
      - "./init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 就绪探测
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
    # 网络
    networks: *internal

  # PostgreSQL 备份
  postgresql-backup:
    # 公共字段
    <<: *service
    # 镜像
    image: "restic/restic@sha256:4cf4a61ef9786f4de53e9de8c8f5c040f33830eb0a10bf3d614410ee2fcb6120"
    # 配置档
    profiles: ["backup"]
    # 环境变量
    environment:
      # 仓库路径
      RESTIC_REPOSITORY: /srv/repo
      # 仓库口令
      RESTIC_PASSWORD: "${RESTIC_PASSWORD:?}"
      # 口令
      PGPASSWORD: "${POSTGRES_PASSWORD:?}"
    # 卷
    volumes:
      # 仓库
      - "postgresql-repo:/srv/repo"
    # 入口
    entrypoint: ["sh", "-c"]
    # 启动命令
    command:
      - |
        restic snapshots --json >/dev/null 2>&1 || restic init -q
        while true; do
          pg_dumpall -h postgresql -U postgres | restic backup --stdin --stdin-filename postgresql-all.sql --host postgresql
          sleep 3600
        done
    # 网络
    networks: *internal
    # 依赖
    depends_on:
      # PostgreSQL
      postgresql:
        # 条件
        condition: "service_healthy"

  # Valkey
  valkey:
    # 公共字段
    <<: *service
    # 镜像
    image: "valkey/valkey@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1"
    # 入口
    entrypoint: ["sh", "-c"]
    # 启动命令 - ACL 生成 + 持久化(其余走镜像默认)
    command:
      - |
        printf 'user default off\nuser app on >%s ~* +@all\n' "$$VALKEY_APP_PASSWORD" > /tmp/users.acl
        exec valkey-server --appendonly yes --aclfile /tmp/users.acl
    # 环境变量
    environment:
      # ACL 口令
      VALKEY_APP_PASSWORD: "${VALKEY_APP_PASSWORD:?}"
    # 卷
    volumes:
      # 数据
      - "valkey-data:/data"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 就绪探测
      test: [
        "CMD-SHELL",
        "valkey-cli --no-auth-warning --user app -a \"$$VALKEY_APP_PASSWORD\" ping | grep -q PONG",
      ]
    # 网络
    networks: *internal

  # Garage
  garage:
    # 公共字段
    <<: *service
    # 镜像
    image: "dxflrs/garage@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690"
    # 启动命令
    command: "/garage server --single-node --default-bucket"
    # 环境变量
    environment:
      # RPC 密钥
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?}"
      # 默认桶访问密钥
      GARAGE_DEFAULT_ACCESS_KEY: "${GARAGE_S3_ACCESS_KEY:?}"
      # 默认桶秘密密钥
      GARAGE_DEFAULT_SECRET_KEY: "${GARAGE_S3_SECRET_KEY:?}"
      # 默认桶名
      GARAGE_DEFAULT_BUCKET: "${GARAGE_DEFAULT_BUCKET:?}"
    # 卷
    volumes:
      # 配置文件
      - "./garage.toml:/etc/garage.toml:ro"
      # 数据
      - "garage-data:/var/lib/garage"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 就绪探测
      test: ["CMD", "/garage", "status"]
    # 网络
    networks: *internal

  # Garage 备份
  garage-backup:
    # 公共字段
    <<: *service
    # 镜像
    image: "restic/restic@sha256:4cf4a61ef9786f4de53e9de8c8f5c040f33830eb0a10bf3d614410ee2fcb6120"
    # 配置档
    profiles: ["backup"]
    # 环境变量
    environment:
      # 仓库路径
      RESTIC_REPOSITORY: /srv/repo
      # 仓库口令
      RESTIC_PASSWORD: "${RESTIC_PASSWORD:?}"
    # 卷
    volumes:
      # 数据
      - "garage-data:/srv/data:ro"
      # 仓库
      - "garage-repo:/srv/repo"
    # 入口
    entrypoint: ["sh", "-c"]
    # 启动命令（对象 RPO ≤ 60 min 恢复 RTO ≤ 4 h）
    command:
      - |
        restic snapshots --json >/dev/null 2>&1 || restic init -q
        while true; do
          restic backup /srv/data --host garage
          sleep 3600
        done

  # S3 客户端
  s3-client:
    # 镜像
    image: "amazon/aws-cli@sha256:c43a4fc95ca09f53ff6bd56016f4dc91fb9b5f3b457a8934f997fc399ccc079e"
    # 配置档
    profiles: ["tools"]
    # 环境变量
    environment:
      # 访问密钥
      AWS_ACCESS_KEY_ID: "${GARAGE_S3_ACCESS_KEY:?}"
      # 秘密密钥
      AWS_SECRET_ACCESS_KEY: "${GARAGE_S3_SECRET_KEY:?}"
      # 区域
      AWS_DEFAULT_REGION: garage
      # 端点地址
      AWS_ENDPOINT_URL: "http://garage:3900"
    # 入口
    entrypoint: ["aws"]
    # 默认命令
    command: "s3 ls"
    # 网络
    networks: *internal
    # 依赖
    depends_on:
      # Garage
      garage:
        # 就绪条件
        condition: "service_healthy"

  # ── 平台 ─────────────────────────

  # Hatchet
  hatchet-lite:
    # 公共字段
    <<: *service
    # 镜像
    image: "ghcr.io/hatchet-dev/hatchet/hatchet-lite@sha256:db8fb8e009a5c892859e52e4aa50b17aa11ab1dd23801cd320492f2942db30d7"
    # 环境变量
    environment:
      # 数据库直连 - 迁移与队列
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?}@postgresql:5432/hatchet?sslmode=disable"
      # 数据库连接 - API 运行时(单机直连,无独立连接池)
      DATABASE_PGBOUNCER_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?}@postgresql:5432/hatchet?sslmode=disable"
      # 消息队列类型
      SERVER_MSGQUEUE_KIND: "postgres"
      # 发布订阅类型
      SERVER_MSGQUEUE_PUBSUB_KIND: "postgres"
      # 服务器端口
      SERVER_PORT: "8080"
      # 服务器地址
      SERVER_URL: "http://hatchet-lite:8888"
      # Cookie 不安全模式
      SERVER_AUTH_COOKIE_INSECURE: "t"
      # Cookie 域
      SERVER_AUTH_COOKIE_DOMAIN: "hatchet-lite:8888"
      # Cookie 密钥
      SERVER_AUTH_COOKIE_SECRETS: "${HATCHET_AUTH_COOKIE_SECRETS:?}"
      # gRPC 不安全模式
      SERVER_GRPC_INSECURE: "t"
      # gRPC 绑定地址
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      # gRPC 端口
      SERVER_GRPC_PORT: "7077"
      # gRPC 广播地址
      SERVER_GRPC_BROADCAST_ADDRESS: "hatchet-lite:7077"
      # 主密钥集
      SERVER_ENCRYPTION_MASTER_KEYSET: "${HATCHET_MASTER_KEYSET:?}"
      # JWT 公钥集
      SERVER_ENCRYPTION_JWT_PUBLIC_KEYSET: "${HATCHET_JWT_PUBLIC_KEYSET:?}"
      # JWT 私钥集
      SERVER_ENCRYPTION_JWT_PRIVATE_KEYSET: "${HATCHET_JWT_PRIVATE_KEYSET:?}"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 就绪探测
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8733/ready"]
      # 启动宽限期
      start_period: "5m"
    # 网络
    networks: *internal
    # 依赖
    depends_on:
      # PostgreSQL
      postgresql:
        # 条件
        condition: "service_healthy"

  # Authelia
  authelia:
    # 公共字段
    <<: *service
    # 镜像
    image: "authelia/authelia@sha256:a9931f4443882fcc43bc368bffd40b51ff1867045d46c8dc2e87fb2b03a32178"
    # 环境变量 - 密钥经 compose 注入,不入库不入 git
    environment:
      # 配置模板过滤器 - 支持配置文件内域名展开
      X_AUTHELIA_CONFIG_FILTERS: "template"
      # 配置路径
      X_AUTHELIA_CONFIG: "/config/configuration.yaml"
      # 会话密钥
      AUTHELIA_SESSION_SECRET: "${AUTHELIA_SESSION_SECRET:?}"
      # 存储加密密钥
      AUTHELIA_STORAGE_ENCRYPTION_KEY: "${AUTHELIA_STORAGE_ENCRYPTION_KEY:?}"
      # 重置口令 JWT 密钥
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "${AUTHELIA_RESET_PASSWORD_JWT_SECRET:?}"
      # PostgreSQL 存储地址
      AUTHELIA_STORAGE_POSTGRES_ADDRESS: "tcp://postgresql:5432"
      # PostgreSQL 存储库
      AUTHELIA_STORAGE_POSTGRES_DATABASE: "authelia"
      # PostgreSQL 存储用户
      AUTHELIA_STORAGE_POSTGRES_USERNAME: "authelia"
      # PostgreSQL 存储口令
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: "${POSTGRES_AUTHELIA_PASSWORD:?}"
    # 卷
    volumes:
      # 配置文件
      - "./authelia/configuration.yaml:/config/configuration.yaml:ro"
      # 用户文件
      - "./authelia/users.yaml:/config/users.yaml:ro"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 就绪探测
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/api/health"]
    # 网络 - 入口网供 Traefik 转发,内部网供 PostgreSQL 存储
    networks:
      # 入口网
      - "edge"
      # 内部网
      - "internal"
    # 依赖
    depends_on:
      # PostgreSQL
      postgresql:
        # 条件
        condition: "service_healthy"
    # 标签
    labels:
      # 启用路由
      traefik.enable: "true"
      # 门户路由
      traefik.http.routers.authelia.rule: "Host(`auth.${AUTH_DOMAIN}`)"
      traefik.http.routers.authelia.tls: "true"
      traefik.http.routers.authelia.tls.certresolver: "le"
      traefik.http.routers.authelia.service: "authelia"
      traefik.http.services.authelia.loadbalancer.server.port: "9090"

  # OpenObserve
  openobserve:
    # 公共字段
    <<: *service
    # 镜像
    image: "public.ecr.aws/zinclabs/openobserve@sha256:600f92cafd2a0697abf2cb443f8ab533e06f7d2d3c031986210fce8339b214d9"
    # 端口
    ports:
      # 管理回环
      - "127.0.0.1:5080:5080"
    # 环境变量
    environment:
      # root 用户邮箱
      ZO_ROOT_USER_EMAIL: "${ZO_ROOT_USER_EMAIL:?}"
      # root 用户口令
      ZO_ROOT_USER_PASSWORD: "${ZO_ROOT_USER_PASSWORD:?}"
      # 数据目录
      ZO_DATA_DIR: "/data"
      # 单节点模式
      ZO_LOCAL_MODE: "true"
      # 单节点数据存储 - 本地文件卷(观测数据不进对象存储)
      ZO_LOCAL_MODE_STORAGE: "fs"
      # 匿名遥测
      ZO_TELEMETRY: "false"
    # 数据卷
    volumes:
      # 数据目录
      - "openobserve-data:/data"
    # 网络
    networks: *internal

  # 采集器
  collector:
    # 公共字段
    <<: *service
    # 镜像
    image: "otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1"
    # 运行用户
    user: "0:0"
    # 启动命令
    command: --config /etc/otelcol-contrib/config.yaml
    # 环境变量
    environment:
      # PostgreSQL 口令
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      # OpenObserve 认证头
      OPENOBSERVE_AUTHORIZATION: "${OPENOBSERVE_AUTHORIZATION:?}"
    # 数据卷
    volumes:
      # 配置文件
      - "./collector.yaml:/etc/otelcol-contrib/config.yaml:ro"
      # 主机进程
      - "/proc:/proc:ro"
      # 主机系统
      - "/sys:/sys:ro"
      # 容器日志
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      # 偏移存储
      - "collector-storage:/var/lib/otelcol"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 配置校验探测
      test: [
        "CMD",
        "/otelcol-contrib",
        "validate",
        "--config=/etc/otelcol-contrib/config.yaml",
      ]
      # 启动宽限期
      start_period: "2m"
    # 网络
    networks: *internal
    # 依赖
    depends_on:
      # OpenObserve
      openobserve:
        # 启动条件
        condition: "service_started"
      # PostgreSQL
      postgresql:
        # 就绪条件
        condition: "service_healthy"

  # Traefik
  traefik:
    # 公共字段
    <<: *service
    # 镜像
    image: "traefik:v3.7.13@sha256:1c32e7c368204fd72812152ebdd2ac0425993df6fd982317deb02e48f2d5423c"
    # 启动命令
    command:
      # Docker 发现
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      # 容器多网络时默认路由网
      - "--providers.docker.network=application_edge"
      # HTTP 入口
      - "--entrypoints.web.address=:80"
      # HTTPS 重定向
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # HTTPS 入口
      - "--entrypoints.websecure.address=:443"
      # ACME 证书
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?}"
      - "--certificatesresolvers.le.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      # 仪表板
      - "--api.dashboard=true"
      # 健康检查
      - "--ping=true"
    # 端口
    ports:
      # HTTP 入口
      - "80:80"
      # HTTPS 入口
      - "443:443"
    # 数据卷
    volumes:
      # Docker 套接字
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # ACME 证书
      - "traefik-acme:/acme"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 就绪探测
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    # 网络
    networks:
      # 入口网
      - "edge"
    # 标签
    labels:
      # 启用路由
      traefik.enable: "true"
      # 仪表板路由
      traefik.http.routers.dashboard.rule: "Host(`traefik.${AUTH_DOMAIN}`)"
      traefik.http.routers.dashboard.service: "api@internal"
      traefik.http.routers.dashboard.middlewares: "authelia,ratelimit"
      traefik.http.routers.dashboard.tls: "true"
      traefik.http.routers.dashboard.tls.certresolver: "le"
      # forward-auth 中间件
      traefik.http.middlewares.authelia.forwardauth.address: "http://authelia:9090/api/verify"
      traefik.http.middlewares.authelia.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.authelia.forwardauth.authResponseHeaders: "Remote-User,Remote-Groups,Remote-Email,Remote-Name"
      # 限流中间件
      traefik.http.middlewares.ratelimit.ratelimit.average: "100"
      traefik.http.middlewares.ratelimit.ratelimit.period: "1m"
      traefik.http.middlewares.ratelimit.ratelimit.burst: "50"

  # 数据库迁移 - 一次性任务,完成后退出
  migrate:
    # 公共字段
    <<: *service
    # 镜像
    image: "${SERVER_IMAGE:-server:latest}"
    # 启动命令 - 迁移至最新版本
    command: ["alembic", "-c", "apps/server/alembic.ini", "upgrade", "head"]
    # 环境
    environment:
      <<: *environment
    # 网络
    networks: *internal
    # 重启策略 - 一次性任务不重启
    restart: "no"
    # 依赖
    depends_on:
      # PostgreSQL
      postgresql:
        # 条件
        condition: "service_healthy"

  # ── 应用 ─────────────────────────

  # API
  api:
    # 公共字段
    <<: *service
    # 镜像
    image: "${SERVER_IMAGE:-server:latest}"
    # 环境
    environment:
      <<: *environment
      # 实时地址
      APP_REALTIME__URL: "valkey://app:${VALKEY_APP_PASSWORD:?}@valkey:6379/0"
      # 实时来源允许列表 - 仅允许 Web 入口
      APP_REALTIME__ORIGINS: '["https://web.${AUTH_DOMAIN}"]'
      # 服务名
      OTEL_SERVICE_NAME: "api"
    # 依赖
    depends_on:
      # 迁移任务
      migrate:
        # 条件 - 迁移成功完成后启动
        condition: "service_completed_successfully"
      # PostgreSQL
      postgresql:
        # 条件
        condition: "service_healthy"
      # Garage
      garage:
        # 条件
        condition: "service_healthy"
      # Valkey
      valkey:
        # 条件
        condition: "service_healthy"
      # 采集器
      collector:
        # 条件
        condition: "service_healthy"
      # Hatchet
      hatchet-lite:
        # 条件
        condition: "service_healthy"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 就绪探测
      test: [
        "CMD-SHELL",
        "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\"",
      ]
    # 网络
    networks: *internal

  # Worker
  worker:
    # 公共字段
    <<: *service
    # 镜像
    image: "${SERVER_IMAGE:-server:latest}"
    # 入口 - 独立进程,与 api 分离
    command: "python -m server.worker"
    # 环境
    environment:
      <<: *environment
      # 服务名
      OTEL_SERVICE_NAME: "worker"
    # 依赖
    depends_on:
      # 迁移任务
      migrate:
        # 条件 - 迁移成功完成后启动
        condition: "service_completed_successfully"
      # PostgreSQL
      postgresql:
        # 条件
        condition: "service_healthy"
      # Garage
      garage:
        # 条件
        condition: "service_healthy"
      # Valkey
      valkey:
        # 条件
        condition: "service_healthy"
      # 采集器
      collector:
        # 条件
        condition: "service_healthy"
      # Hatchet
      hatchet-lite:
        # 条件
        condition: "service_healthy"
    # 健康检查 - 进程级探活,worker 不监听 HTTP
    healthcheck:
      <<: *healthcheck
      # 就绪探测
      test: ["CMD-SHELL", "python -c \"import server.worker\""]
    # 网络
    networks: *internal

  # Web
  web:
    # 公共字段
    <<: *service
    # 镜像
    image: "${WEB_IMAGE:-web:latest}"
    # 构建参数（VITE_* 为构建时注入）
    build:
      context: ".."
      dockerfile: "apps/web/Dockerfile"
      args:
        # 遥测端点
        VITE_TELEMETRY_URL: "${VITE_TELEMETRY_URL:-}"
        # OIDC 发行方
        VITE_OIDC_ISSUER: "${VITE_OIDC_ISSUER:-}"
        # OIDC 客户端 ID
        VITE_OIDC_CLIENT_ID: "${VITE_OIDC_CLIENT_ID:-}"
        # API 基地址
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
        # 心跳间隔
        VITE_HEARTBEAT_INTERVAL: "${VITE_HEARTBEAT_INTERVAL:-}"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 就绪探测
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q app"]
      # 启动宽限期
      start_period: "10s"
    # 网络 - 入口网供 Traefik 转发,内部网供访问 API
    networks:
      # 入口网
      - "edge"
      # 内部网
      - "internal"
    # 依赖
    depends_on:
      # API
      api:
        # 条件 - API 就绪后启动
        condition: "service_healthy"
    # 标签
    labels:
      # 启用路由
      traefik.enable: "true"
      # HTTP 路由
      traefik.http.routers.web.rule: "Host(`web.${AUTH_DOMAIN}`)"
      traefik.http.routers.web.entrypoints: "websecure"
      traefik.http.routers.web.tls: "true"
      traefik.http.routers.web.tls.certresolver: "le"
      traefik.http.routers.web.service: "web"
      # forward-auth 与限流 - Web 为唯一公网入口
      traefik.http.routers.web.middlewares: "authelia,ratelimit"
      traefik.http.services.web.loadbalancer.server.port: "80"
