# Docker Compose - `https://docs.docker.com/compose/`

# 项目名
name: application

# 引入
include:
  # PostgreSQL
  - "postgresql/compose.yaml"
  # PgBouncer
  - "pgbouncer/compose.yaml"
  # Valkey
  - "valkey/compose.yaml"

# 命名网络
networks:
  # 入口网
  edge:
  # 应用内部网
  app-internal:
  # 数据内部网
  data-internal:
  # 管理网
  management:
    # 外部隔离
    internal: true
  # 出站网
  egress:

# 命名卷
volumes:
  # PostgreSQL 数据
  postgresql-data:
  # PostgreSQL 仓库
  postgresql-repo:
  # Valkey 数据
  valkey-data:

# 密钥
secrets:
  # PostgreSQL
  postgres:
    # 环境变量
    environment: POSTGRES_PASSWORD
