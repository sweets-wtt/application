# Docker Compose - https://docs.docker.com/compose/

# 项目名
name: application

# 引入
include:
  # PostgreSQL
  - "postgresql/compose.yaml"
  # PgBouncer
  - "pgbouncer/compose.yaml"

# 命名网络
networks:
  # 入口网
  edge:
  # 应用内部网
  app-internal:
  # 数据内部网
  data-internal:
  # 管理网
  management:
    # 外部隔离
    internal: true
  # 出站网
  egress:

# 命名卷
volumes:
  # PostgreSQL 数据
  postgresql-data:

# 密钥
secrets:
  # PostgreSQL 超管口令
  postgres-password:
    # 来源环境变量
    environment: POSTGRES_PASSWORD

# 服务
services:
  # API
  api:
    # 镜像
    image: "${SERVER_IMAGE:?}"
    # 重启策略
    restart: unless-stopped
    # 环境变量
    environment:
      # 数据库连接
      DATABASE__URL: "${DATABASE__URL:?}"
    # 健康检查
    healthcheck:
      # 就绪探测
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      # 间隔
      interval: "10s"
      # 超时
      timeout: "5s"
      # 重试次数
      retries: 5
      # 启动宽限期
      start_period: "30s"
    # 网络
    networks:
      # 应用内部网
      - "app-internal"
      # 数据内部网
      - "data-internal"
    # 依赖
    depends_on:
      # PostgreSQL
      postgresql:
        # 就绪条件
        condition: "service_healthy"

  # Worker
  worker:
    # 镜像
    image: "${SERVER_IMAGE:?}"
    # 重启策略
    restart: unless-stopped
    # 环境变量
    environment:
      # 数据库连接
      DATABASE__URL: "${DATABASE__URL:?}"
    # 健康检查
    healthcheck:
      # 就绪探测
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      # 间隔
      interval: "10s"
      # 超时
      timeout: "5s"
      # 重试次数
      retries: 5
      # 启动宽限期
      start_period: "30s"
    # 网络
    networks:
      # 数据内部网
      - "data-internal"
    # 依赖
    depends_on:
      # PostgreSQL
      postgresql:
        # 就绪条件
        condition: "service_healthy"

  # Web
  web:
    # 镜像
    image: "${WEB_IMAGE:?}"
    # 重启策略
    restart: unless-stopped
    # 健康检查
    healthcheck:
      # 就绪探测
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8080/
      # 间隔
      interval: "10s"
      # 超时
      timeout: "5s"
      # 重试次数
      retries: 5
      # 启动宽限期
      start_period: "30s"
    # 网络
    networks:
      # 入口网
      - "edge"
