# Docker Compose - https://docs.docker.com/compose/

# 项目名
name: application

# 引入
include:
  # PostgreSQL
  - "postgresql/compose.yaml"
  # PgBouncer
  - "pgbouncer/compose.yaml"
  # Garage
  - "garage/compose.yaml"
  # Valkey
  - "valkey/compose.yaml"

# 命名网络
networks:
  # 入口网
  edge:
  # 应用内部网
  app-internal:
  # 数据内部网
  data-internal:
  # 管理网
  management:
    # 外部隔离
    internal: true
  # 出站网
  egress:

# 命名卷
volumes:
  # PostgreSQL 数据
  postgresql-data:
  # Garage 数据
  garage-data:
  # 归档仓库
  garage-repo:
  # Valkey 数据
  valkey-data:

# 密钥
secrets:
  # PostgreSQL 超管口令
  postgres-password:
    # 来源环境变量
    environment: POSTGRES_PASSWORD

# 服务
services:
  # API
  api:
    # 镜像
    image: "${SERVER_IMAGE:?}"
    # 重启策略
    restart: unless-stopped
    # 环境变量
    environment:
      # 数据库连接
      DATABASE__URL: "${DATABASE__URL:?}"
      # 对象存储端点
      STORAGE__URL: "http://garage:3900"
      # 对象存储区域
      STORAGE__REGION: "garage"
      # 对象存储访问密钥
      STORAGE__ACCESS_KEY_ID: "${GARAGE_S3_ACCESS_KEY:?}"
      # 对象存储秘密密钥
      STORAGE__SECRET_ACCESS_KEY: "${GARAGE_S3_SECRET_KEY:?}"
      # 对象存储桶名
      STORAGE__BUCKET: "${GARAGE_DEFAULT_BUCKET:?}"
      # 缓存连接
      CACHE__URL: "valkey://app:${VALKEY_APP_PASSWORD:?}@valkey:6379/0"
      # 允许的实时 Origin
      REALTIME__ORIGINS: "${REALTIME_ORIGINS:-[]}"
    # 健康检查
    healthcheck:
      # 就绪探测
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      # 间隔
      interval: "10s"
      # 超时
      timeout: "5s"
      # 重试次数
      retries: 5
      # 启动宽限期
      start_period: "30s"
    # 网络
    networks:
      # 应用内部网
      - "app-internal"
      # 数据内部网
      - "data-internal"
    # 依赖
    depends_on:
      # PostgreSQL
      postgresql:
        # 就绪条件
        condition: "service_healthy"
      # PgBouncer
      pgbouncer:
        # 就绪条件
        condition: "service_healthy"
      # Garage
      garage:
        # 就绪条件
        condition: "service_healthy"
      # Valkey
      valkey:
        # 就绪条件
        condition: "service_healthy"

  # Worker
  worker:
    # 镜像
    image: "${SERVER_IMAGE:?}"
    # 重启策略
    restart: unless-stopped
    # 环境变量
    environment:
      # 数据库连接
      DATABASE__URL: "${DATABASE__URL:?}"
      # 对象存储端点
      STORAGE__URL: "http://garage:3900"
      # 对象存储区域
      STORAGE__REGION: "garage"
      # 对象存储访问密钥
      STORAGE__ACCESS_KEY_ID: "${GARAGE_S3_ACCESS_KEY:?}"
      # 对象存储秘密密钥
      STORAGE__SECRET_ACCESS_KEY: "${GARAGE_S3_SECRET_KEY:?}"
      # 对象存储桶名
      STORAGE__BUCKET: "${GARAGE_DEFAULT_BUCKET:?}"
      # 缓存连接
      CACHE__URL: "valkey://app:${VALKEY_APP_PASSWORD:?}@valkey:6379/0"
    # 健康检查
    healthcheck:
      # 就绪探测
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      # 间隔
      interval: "10s"
      # 超时
      timeout: "5s"
      # 重试次数
      retries: 5
      # 启动宽限期
      start_period: "30s"
    # 网络
    networks:
      # 数据内部网
      - "data-internal"
    # 依赖
    depends_on:
      # PostgreSQL
      postgresql:
        # 就绪条件
        condition: "service_healthy"
      # PgBouncer
      pgbouncer:
        # 就绪条件
        condition: "service_healthy"
      # Garage
      garage:
        # 就绪条件
        condition: "service_healthy"
      # Valkey
      valkey:
        # 就绪条件
        condition: "service_healthy"

  # Web
  web:
    # 镜像
    image: "${WEB_IMAGE:?}"
    # 重启策略
    restart: unless-stopped
    # 健康检查
    healthcheck:
      # 就绪探测
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8080/
      # 间隔
      interval: "10s"
      # 超时
      timeout: "5s"
      # 重试次数
      retries: 5
      # 启动宽限期
      start_period: "30s"
    # 网络
    networks:
      # 入口网
      - "edge"
