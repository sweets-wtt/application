# 项目名
name: application

# 自定义网络
networks:
  # 入口网络
  edge:
  # 内部网络
  internal:

# 具名卷
volumes:
  # Caddy 数据卷
  caddy-data:

# 服务公共字段
x-service: &service # 重启策略
  restart: unless-stopped
  # 日志配置
  logging:
    # 日志驱动
    driver: journald

# 健康检查公共参数
x-healthcheck: &healthcheck # 检查间隔
  interval: "10s"
  # 检查超时
  timeout: "5s"
  # 重试次数
  retries: 5
  # 启动宽限期
  start_period: "30s"

# 内部网络引用
x-internal: &internal
  - "internal"

# 服务定义
services:
  # 入口代理
  caddy:
    # 公共字段
    <<: *service
    # 镜像
    image: "caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e"
    # 环境变量
    environment:
      # 站点域名
      AUTH_DOMAIN: "${AUTH_DOMAIN:?}"
      # ACME 证书邮箱
      ACME_EMAIL: "${ACME_EMAIL:?}"
    # 端口映射
    ports:
      # HTTP
      - "80:80"
      # HTTPS
      - "443:443"
      # HTTP/3
      - "443:443/udp"
    # 挂载卷
    volumes:
      # 代理配置
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      # 数据卷
      - "caddy-data:/data"
    # 健康检查
    healthcheck:
      # 公共参数
      <<: *healthcheck
      # 检查命令
      test: ["CMD", "caddy", "version"]
    # 网络
    networks:
      - "edge"

  # 后端服务
  api:
    # 公共字段
    <<: *service
    # 镜像
    image: "${SERVER_IMAGE:-server:latest}"
    # 健康检查
    healthcheck:
      # 公共参数
      <<: *healthcheck
      # 检查命令
      test: [
        "CMD-SHELL",
        "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\"",
      ]
    # 网络
    networks: *internal

  # 前端服务
  web:
    # 公共字段
    <<: *service
    # 镜像
    image: "${WEB_IMAGE:-web:latest}"
    # 构建配置
    build:
      # 构建上下文
      context: ".."
      # 构建文件
      dockerfile: "apps/web/Dockerfile"
      # 构建参数
      args:
        # API 基地址
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
        # 心跳间隔
        VITE_HEARTBEAT_INTERVAL: "${VITE_HEARTBEAT_INTERVAL:-}"
    # 健康检查
    healthcheck:
      # 公共参数
      <<: *healthcheck
      # 检查命令
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q app"]
      # 启动宽限期
      start_period: "10s"
    # 网络
    networks:
      # 入口网络
      - "edge"
      # 内部网络
      - "internal"
    # 依赖服务
    depends_on:
      # 后端服务
      api:
        # 就绪条件
        condition: "service_healthy"
