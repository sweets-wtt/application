# Docker Compose - `https://docs.docker.com/compose/`
# 分层引入:数据 / 平台 / 应用,新增服务写入所属层,include 清单恒定

# yaml-language-server: $schema=https://json.schemastore.org/compose.json

# 项目名
name: application

# 引入
include:
  # 数据层
  - "data.compose.yaml"
  # 平台层
  - "platform.compose.yaml"
  # 应用层
  - "app.compose.yaml"

# 命名网络
networks:
  # 入口网
  edge:
  # 内部网
  internal:

# 命名卷
volumes:
  # PostgreSQL 数据
  postgresql-data:
  # PostgreSQL 仓库
  postgresql-repo:
  # Valkey 数据
  valkey-data:
  # Garage 数据
  garage-data:
  # Garage 仓库
  garage-repo:
  # OpenObserve 数据
  openobserve-data:
  # Collector 存储
  collector-storage:
  # Traefik 证书
  traefik-acme:
