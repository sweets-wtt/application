# HTTP
http:
  # 中间件
  middlewares:
    # 前向认证
    authentik:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/authenticatetraefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid

    # 限流
    ratelimit:
      rateLimit:
        average: 100
        burst: 50
