# Casdoor 初始数据 - 仅补齐缺失对象
organizations:
  - owner: admin
    name: application
    displayName: Application
    passwordType: bcrypt
    defaultApplication: app-web

applications:
  - owner: admin
    name: app-web
    organization: application
    displayName: Web
    clientId: __CLIENT_ID__
    clientSecret: __CLIENT_SECRET__
    redirectUris:
      - https://web.__AUTH_DOMAIN__/auth/callback
    enablePassword: true
    enableSignUp: true
    tokenFormat: JWT
    expireInHours: 24
    signinMethods:
      - name: Password
        displayName: Password
        rule: All
    signupItems:
      - name: Username
        visible: true
        required: true
        prompted: false
        rule: None
      - name: Display name
        visible: true
        required: true
        prompted: false
        rule: None
      - name: Password
        visible: true
        required: true
        prompted: false
        rule: None
      - name: Confirm password
        visible: true
        required: true
        prompted: false
        rule: None
      - name: Email
        visible: true
        required: true
        prompted: false
        rule: None
      - name: Agreement
        visible: true
        required: true
        prompted: false
        rule: None

roles:
  - owner: application
    name: admin
    displayName: Admin
    isEnabled: true
  - owner: application
    name: editor
    displayName: Editor
    isEnabled: true
  - owner: application
    name: viewer
    displayName: Viewer
    isEnabled: true
