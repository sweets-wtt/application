# Docker Compose - `https://docs.docker.com/compose/`

# 服务
services:
  # PgBouncer
  pgbouncer:
    # 镜像
    image: "edoburu/pgbouncer@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340"
    # 重启策略
    restart: unless-stopped
    # 环境变量
    environment:
      # 主机
      DB_HOST: postgresql
      # 用户
      DB_USER: postgres
      # 口令
      DB_PASSWORD: "${POSTGRES_PASSWORD:?}"
      # 认证方式
      AUTH_TYPE: "scram-sha-256"
    # 数据卷
    volumes:
      # 配置文件
      - "./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro"
    # 健康检查
    healthcheck:
      # 就绪探测
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      # 间隔
      interval: "10s"
      # 超时
      timeout: "5s"
      # 重试次数
      retries: 5
      # 启动宽限期
      start_period: "30s"
    # 网络
    networks:
      # 数据内部网
      - "data-internal"
    # 依赖
    depends_on:
      # PostgreSQL
      postgresql:
        # 条件
        condition: "service_healthy"
