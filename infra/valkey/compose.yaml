# Docker Compose - `https://docs.docker.com/compose/`

# 服务
services:
  # Valkey
  valkey:
    image: "valkey/valkey@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1"
    restart: unless-stopped
    command:
      - "sh"
      - "-c"
      - |
        printf 'user default off\nuser app on >%s ~* +@all\n' "$$VALKEY_APP_PASSWORD" > /tmp/users.acl
        exec valkey-server /etc/valkey/valkey.conf
    environment:
      # ACL 口令
      VALKEY_APP_PASSWORD: "${VALKEY_APP_PASSWORD:?}"
    volumes:
      # 配置文件
      - "./valkey.conf:/etc/valkey/valkey.conf:ro"
      # 数据目录
      - "valkey-data:/data"
    # 健康检查
    healthcheck:
      test: [
        "CMD-SHELL",
        "valkey-cli --no-auth-warning --user app -a \"$$VALKEY_APP_PASSWORD\" ping | grep -q PONG",
      ]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "30s"
    networks:
      # 数据内部网
      - "data-internal"
