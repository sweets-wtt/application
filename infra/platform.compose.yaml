# 平台层编排 - Authelia / Hatchet / OpenObserve / Traefik

# yaml-language-server: $schema=https://json.schemastore.org/compose.json

# 服务公共字段
x-service: &service # 重启策略
  restart: unless-stopped

# 健康检查参数
x-healthcheck: &healthcheck # 间隔
  interval: "10s"
  # 超时
  timeout: "5s"
  # 重试次数
  retries: 5
  # 启动宽限期
  start_period: "30s"

# 内部网
x-internal: &internal # 内部网
  - "internal"

# 服务
services:
  # Hatchet
  hatchet-lite:
    # 公共字段
    <<: *service
    # 镜像
    image: "ghcr.io/hatchet-dev/hatchet/hatchet-lite@sha256:db8fb8e009a5c892859e52e4aa50b17aa11ab1dd23801cd320492f2942db30d7"
    # 环境变量
    environment:
      # 数据库直连 - 迁移与队列
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?}@postgresql:5432/hatchet?sslmode=disable"
      # 数据库连接 - API 运行时(单机直连,无独立连接池)
      DATABASE_PGBOUNCER_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?}@postgresql:5432/hatchet?sslmode=disable"
      # 消息队列类型
      SERVER_MSGQUEUE_KIND: "postgres"
      # 发布订阅类型
      SERVER_MSGQUEUE_PUBSUB_KIND: "postgres"
      # 服务器端口
      SERVER_PORT: "8080"
      # 服务器地址
      SERVER_URL: "http://hatchet-lite:8888"
      # Cookie 不安全模式
      SERVER_AUTH_COOKIE_INSECURE: "t"
      # Cookie 域
      SERVER_AUTH_COOKIE_DOMAIN: "hatchet-lite:8888"
      # Cookie 密钥
      SERVER_AUTH_COOKIE_SECRETS: "${HATCHET_AUTH_COOKIE_SECRETS:?}"
      # gRPC 不安全模式
      SERVER_GRPC_INSECURE: "t"
      # gRPC 绑定地址
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      # gRPC 端口
      SERVER_GRPC_PORT: "7077"
      # gRPC 广播地址
      SERVER_GRPC_BROADCAST_ADDRESS: "hatchet-lite:7077"
      # 主密钥集
      SERVER_ENCRYPTION_MASTER_KEYSET: "${HATCHET_MASTER_KEYSET:?}"
      # JWT 公钥集
      SERVER_ENCRYPTION_JWT_PUBLIC_KEYSET: "${HATCHET_JWT_PUBLIC_KEYSET:?}"
      # JWT 私钥集
      SERVER_ENCRYPTION_JWT_PRIVATE_KEYSET: "${HATCHET_JWT_PRIVATE_KEYSET:?}"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 就绪探测
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8733/ready"]
      # 启动宽限期
      start_period: "5m"
    # 网络
    networks: *internal
    # 依赖
    depends_on:
      # PostgreSQL
      postgresql:
        # 条件
        condition: "service_healthy"

  # Authelia
  authelia:
    # 公共字段
    <<: *service
    # 镜像
    image: "authelia/authelia@sha256:a9931f4443882fcc43bc368bffd40b51ff1867045d46c8dc2e87fb2b03a32178"
    # 环境变量 - 密钥经 compose 注入,不入库不入 git
    environment:
      # 配置模板过滤器 - 支持配置文件内域名展开
      X_AUTHELIA_CONFIG_FILTERS: "template"
      # 配置路径
      X_AUTHELIA_CONFIG: "/config/configuration.yaml"
      # 会话密钥
      AUTHELIA_SESSION_SECRET: "${AUTHELIA_SESSION_SECRET:?}"
      # 存储加密密钥
      AUTHELIA_STORAGE_ENCRYPTION_KEY: "${AUTHELIA_STORAGE_ENCRYPTION_KEY:?}"
      # 重置口令 JWT 密钥
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "${AUTHELIA_RESET_PASSWORD_JWT_SECRET:?}"
      # PostgreSQL 存储地址
      AUTHELIA_STORAGE_POSTGRES_ADDRESS: "tcp://postgresql:5432"
      # PostgreSQL 存储库
      AUTHELIA_STORAGE_POSTGRES_DATABASE: "authelia"
      # PostgreSQL 存储用户
      AUTHELIA_STORAGE_POSTGRES_USERNAME: "authelia"
      # PostgreSQL 存储口令
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: "${POSTGRES_AUTHELIA_PASSWORD:?}"
    # 卷
    volumes:
      # 配置文件
      - "./authelia/configuration.yaml:/config/configuration.yaml:ro"
      # 用户文件
      - "./authelia/users.yaml:/config/users.yaml:ro"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 就绪探测
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/api/health"]
    # 网络
    networks:
      # 入口网
      - "edge"
    # 依赖
    depends_on:
      # PostgreSQL
      postgresql:
        # 条件
        condition: "service_healthy"
    # 标签
    labels:
      # 启用路由
      traefik.enable: "true"
      # 门户路由
      traefik.http.routers.authelia.rule: "Host(`auth.${AUTH_DOMAIN}`)"
      traefik.http.routers.authelia.tls: "true"
      traefik.http.routers.authelia.tls.certresolver: "le"
      traefik.http.routers.authelia.service: "authelia"
      traefik.http.services.authelia.loadbalancer.server.port: "9090"

  # OpenObserve
  openobserve:
    # 公共字段
    <<: *service
    # 镜像
    image: "public.ecr.aws/zinclabs/openobserve@sha256:600f92cafd2a0697abf2cb443f8ab533e06f7d2d3c031986210fce8339b214d9"
    # 端口
    ports:
      # 验收回环
      - "127.0.0.1:5080:5080"
    # 环境变量
    environment:
      # root 用户邮箱
      ZO_ROOT_USER_EMAIL: "${ZO_ROOT_USER_EMAIL:?}"
      # root 用户口令
      ZO_ROOT_USER_PASSWORD: "${ZO_ROOT_USER_PASSWORD:?}"
      # 数据目录
      ZO_DATA_DIR: "/data"
      # 单节点模式
      ZO_LOCAL_MODE: "true"
      # 单节点数据存储 - 本地文件卷(观测数据不进对象存储)
      ZO_LOCAL_MODE_STORAGE: "fs"
      # 匿名遥测
      ZO_TELEMETRY: "false"
    # 数据卷
    volumes:
      # 数据目录
      - "openobserve-data:/data"
    # 网络
    networks: *internal

  # 采集器
  collector:
    # 公共字段
    <<: *service
    # 镜像
    image: "otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1"
    # 运行用户
    user: "0:0"
    # 启动命令
    command: --config /etc/otelcol-contrib/config.yaml
    # 环境变量
    environment:
      # PostgreSQL 口令
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      # OpenObserve 认证头
      OPENOBSERVE_AUTHORIZATION: "${OPENOBSERVE_AUTHORIZATION:?}"
    # 数据卷
    volumes:
      # 配置文件
      - "./collector.yaml:/etc/otelcol-contrib/config.yaml:ro"
      # 主机进程
      - "/proc:/proc:ro"
      # 主机系统
      - "/sys:/sys:ro"
      # 容器日志
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      # 偏移存储
      - "collector-storage:/var/lib/otelcol"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 配置校验探测
      test: [
        "CMD",
        "/otelcol-contrib",
        "validate",
        "--config=/etc/otelcol-contrib/config.yaml",
      ]
      # 启动宽限期
      start_period: "2m"
    # 网络
    networks: *internal
    # 依赖
    depends_on:
      # OpenObserve
      openobserve:
        # 启动条件
        condition: "service_started"
      # PostgreSQL
      postgresql:
        # 就绪条件
        condition: "service_healthy"

  # Traefik
  traefik:
    # 公共字段
    <<: *service
    # 镜像
    image: "traefik:v3.7.13@sha256:1c32e7c368204fd72812152ebdd2ac0425993df6fd982317deb02e48f2d5423c"
    # 启动命令
    command:
      # Docker 发现
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      # 容器多网络时默认路由网
      - "--providers.docker.network=application_edge"
      # HTTP 入口
      - "--entrypoints.web.address=:80"
      # HTTPS 重定向
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # HTTPS 入口
      - "--entrypoints.websecure.address=:443"
      # ACME 证书
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?}"
      - "--certificatesresolvers.le.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      # 仪表板
      - "--api.dashboard=true"
      # 健康检查
      - "--ping=true"
    # 端口
    ports:
      # HTTP 入口
      - "80:80"
      # HTTPS 入口
      - "443:443"
    # 数据卷
    volumes:
      # Docker 套接字
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # ACME 证书
      - "traefik-acme:/acme"
    # 健康检查
    healthcheck:
      <<: *healthcheck
      # 就绪探测
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    # 网络
    networks:
      # 入口网
      - "edge"
    # 标签
    labels:
      # 启用路由
      traefik.enable: "true"
      # 仪表板路由
      traefik.http.routers.dashboard.rule: "Host(`traefik.${AUTH_DOMAIN}`)"
      traefik.http.routers.dashboard.service: "api@internal"
      traefik.http.routers.dashboard.middlewares: "authelia,ratelimit"
      traefik.http.routers.dashboard.tls: "true"
      traefik.http.routers.dashboard.tls.certresolver: "le"
      # forward-auth 中间件
      traefik.http.middlewares.authelia.forwardauth.address: "http://authelia:9090/api/verify"
      traefik.http.middlewares.authelia.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.authelia.forwardauth.authResponseHeaders: "Remote-User,Remote-Groups,Remote-Email,Remote-Name"
      # 限流中间件
      traefik.http.middlewares.ratelimit.ratelimit.average: "100"
      traefik.http.middlewares.ratelimit.ratelimit.period: "1m"
      traefik.http.middlewares.ratelimit.ratelimit.burst: "50"
