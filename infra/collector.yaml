# 扩展
extensions:
  # 文件存储
  file_storage:
    # 存储目录
    directory: /var/lib/otelcol

# 接收器
receivers:
  # 主机指标 - 采集间隔默认 1m
  hostmetrics:
    # 采集器
    scrapers:
      # CPU
      cpu:
      # 内存
      memory:
      # 负载
      load:
      # 网络
      network:
      # 磁盘 I/O
      disk:
      # 文件系统
      filesystem:
      # 交换分区
      paging:

  # 系统日志 - podman 默认将容器日志写入 journald
  journald:
    # 宿主机根 - 在 chroot 内执行宿主机同版本 journalctl
    root_path: /host
    # journalctl 路径 - 相对 root_path 的绝对路径
    journalctl_path: /usr/bin/journalctl
    # 起始位置 - 仅采集新日志，避免启动回灌历史
    start_at: end
    # 存储扩展 - 游标持久化，重启后续读
    storage: file_storage
    # 操作器
    operators:
      # 正文字段
      - type: move
        from: attributes.MESSAGE
        to: body

  # PostgreSQL
  postgresql:
    # 端点地址
    endpoint: postgresql:5432
    # 用户名
    username: postgres
    # 口令
    password: ${env:POSTGRES_PASSWORD}
    # 采集间隔
    collection_interval: 1m
    # 传输安全
    tls:
      # 关闭加密
      insecure: true

# 处理器
processors:
  # 脱敏
  redaction:
    # 保留全部键
    allow_all_keys: true
    # 阻断值
    blocked_values:
      # 口令键值对
      - '(?i)(password|passwd|secret|token|api[_-]?key|authorization|credential)[=:]\s*\S+'
      # Bearer 令牌
      - '(?i)bearer\s+[a-z0-9._~+/-]+=*'
      # AWS 访问密钥
      - "AKIA[0-9A-Z]{16}"
    # 摘要
    summary: silent

# 导出器
exporters:
  # OpenObserve
  otlphttp/openobserve:
    # 端点地址
    endpoint: http://openobserve:5080/api/default
    # 请求头
    headers:
      # 认证
      Authorization: ${env:OPENOBSERVE_AUTHORIZATION}

# 服务
service:
  # 扩展
  extensions: [file_storage]
  # 管道
  pipelines:
    # 指标 - 仅基础设施
    metrics:
      # 接收器
      receivers: [hostmetrics, postgresql]
      # 处理器
      processors: [redaction]
      # 导出器
      exporters: [otlphttp/openobserve]
    # 日志 - 仅容器日志(应用日志由 SDK 直连)
    logs:
      # 接收器
      receivers: [journald]
      # 处理器
      processors: [redaction]
      # 导出器
      exporters: [otlphttp/openobserve]
