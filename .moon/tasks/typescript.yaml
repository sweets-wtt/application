# moon TypeScript 任务 - https://moonrepo.dev/docs/config/tasks

# 继承条件
inheritedBy:
  # 工具链
  toolchains:
    - javascript
    - bun

# 任务
tasks:
  # 类型检查
  typecheck:
    command: "tsc --build"
    deps:
      - "setup-typescript"
    options:
      runInCI: true

  # 测试
  test:
    command: "bun run vitest run"
    deps:
      - "setup-typescript"
    options:
      runInCI: true

  # 生成 TypeScript 契约客户端
  generate-typescript:
    command: "sh"
    args:
      - -c
      - "orval --config packages/typescript/contracts/orval.config.ts --formatter oxfmt && git diff --exit-code -- packages/typescript/contracts/src"
    deps:
      - "openapi"
    options:
      runInCI: true
      shell: false
      runFromWorkspaceRoot: true
