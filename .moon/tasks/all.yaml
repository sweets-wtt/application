# moon 全局任务 - https://moonrepo.dev/docs/config/tasks

# 任务
tasks:
  # 安装工具
  setup-tools:
    # 命令
    command: 'mise install --locked'

  # 环境初始化
  setup:
    # 命令
    command: 'moon sync vcs-hooks'
    # 前置任务
    deps:
      - 'setup-tools'

  # 代码检查
  lint:
    # 前置任务
    deps:
      - 'typos'
      - 'no-pipe'
      - 'zizmor'
      - 'gitleaks'
      - 'validate'
    # 选项
    options:
      # CI 运行
      runInCI: false

  # 拼写检查
  typos:
    # 命令
    command: 'typos'
    # 选项
    options:
      # CI 运行
      runInCI: false

  # 链接检查
  lychee:
    # 命令
    command: 'lychee --config lychee.toml .'
    # 选项
    options:
      # CI 运行
      runInCI: false

  # 管道检查
  no-pipe:
    # 命令
    command: 'sh'
    # 参数
    args:
      - -c
      - 'rg --hidden -e "(curl|wget)\s+[^|\n]*\|\s*(sudo\s+)?(sh|bash|zsh|ksh|dash)(\s|$)" ; [ $? -eq 1 ]'
    # 选项
    options:
      # 缓存
      cache: false
      # CI 运行
      runInCI: false
      # Shell
      shell: false

  # 工作流审计
  zizmor:
    # 命令
    command: 'zizmor .github/workflows'
    # 选项
    options:
      # CI 运行
      runInCI: false

  # 密钥扫描
  gitleaks:
    # 命令
    command: 'gitleaks git --config .gitleaks.toml .'
    # 选项
    options:
      # CI 运行
      runInCI: false

  # 漏洞扫描
  audit:
    # 命令
    command: 'trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --config trivy.yaml .'
    # 选项
    options:
      # CI 运行
      runInCI: true

  # 配置校验
  validate:
    # 命令
    command: 'validator renovate.json5'
    # 选项
    options:
      # CI 运行
      runInCI: false

  # 契约检查
  openapi:
    # 命令
    command: 'vacuum lint --ruleset contracts/http/vacuum.yaml contracts/http/openapi.yaml'

  # 契约聚合
  contracts:
    # 前置任务
    deps:
      - 'openapi'
