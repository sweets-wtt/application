# moon 全局任务 - https://moonrepo.dev/docs/config/tasks

# 任务
tasks:
  # 环境初始化
  setup:
    # 运行命令
    command: "moon sync vcs-hooks"
    # 前置任务
    deps:
      - "setup-tools"
      - "setup-python"
      - "setup-typescript"
    # 任务选项
    options:
      # 启用缓存
      cache: false

  # 安装工具
  setup-tools:
    # 运行命令
    command: "mise install --locked"
    # 任务选项
    options:
      # 启用缓存
      cache: false

  # 代码检查
  lint:
    # 前置任务
    deps:
      - "typos"
      - "oxfmt"
      - "no-pipe"
      - "zizmor"
      - "validate"
      - "gitleaks"
      - "ruff"
      - "oxlint"
    # 任务选项
    options:
      # CI 运行
      runInCI: false

  # 拼写检查
  typos:
    # 运行命令
    command: "typos"
    # 任务选项
    options:
      # CI 运行
      runInCI: false

  # Oxfmt 检查
  oxfmt-check:
    # 运行命令
    command: "oxfmt --check ."
    # 任务选项
    options:
      # CI 运行
      runInCI: false
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # Oxfmt 格式化
  oxfmt-format:
    # 运行命令
    command: "oxfmt ."
    # 任务选项
    options:
      # 启用缓存
      cache: false
      # CI 运行
      runInCI: false
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # Oxfmt 聚合
  oxfmt:
    # 前置任务
    deps:
      - "oxfmt-format"
      - "oxfmt-check"
    # 任务选项
    options:
      # CI 运行
      runInCI: false
      # 并行运行前置任务
      runDepsInParallel: false

  # 管道检查
  no-pipe:
    # 运行命令
    command: "sh"
    # 命令参数
    args:
      - -c
      - >-
        rg --hidden -e "(curl|wget)\s+[^|\n]*\|\s*(sudo\s+)?(sh|bash|zsh|ksh|dash)(\s|$)" ; [ $? -eq 1 ]
    # 任务选项
    options:
      # 启用缓存
      cache: false
      # CI 运行
      runInCI: false
      # 经 shell 运行
      shell: false

  # 工作流审计
  zizmor:
    # 运行命令
    command: "zizmor .github/workflows"
    # 任务选项
    options:
      # CI 运行
      runInCI: false
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # 链接检查
  lychee:
    # 运行命令
    command: "lychee --config lychee.toml ."
    # 任务选项
    options:
      # 启用缓存
      cache: false
      # CI 运行
      runInCI: false
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # 配置校验
  validate:
    # 运行命令
    command: "validator renovate.json5"
    # 任务选项
    options:
      # CI 运行
      runInCI: false
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # 密钥扫描
  gitleaks:
    # 运行命令
    command: "gitleaks git --config .gitleaks.toml ."
    # 任务选项
    options:
      # CI 运行
      runInCI: false
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # 漏洞扫描
  trivy:
    # 运行命令
    command: "trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --config trivy.yaml ."
    # 任务选项
    options:
      # CI 运行
      runInCI: true
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # 契约聚合
  contracts:
    # 前置任务
    deps:
      - "openapi"

  # 契约检查
  openapi:
    # 运行命令
    command: "vacuum lint --ruleset contracts/http/vacuum.yaml contracts/http/openapi.yaml"
    # 任务选项
    options:
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # Compose 配置检查
  compose-config:
    # 运行命令
    command: "docker compose -f infra/compose.yaml --project-directory infra config --quiet"
    # 任务选项
    options:
      # CI 运行
      runInCI: true
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # Compose 误配扫描
  compose-misconfig:
    # 运行命令
    command: "trivy fs --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 --config trivy.yaml ."
    # 任务选项
    options:
      # CI 运行
      runInCI: true
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # 服务编排检查
  compose-check:
    # 前置任务
    deps:
      - "compose-config"
      - "compose-misconfig"
    # 任务选项
    options:
      # CI 运行
      runInCI: true

  # 服务编排启动
  compose-up:
    # 运行命令
    command: "sh"
    # 命令参数
    args:
      - -c
      - >-
        if docker compose -f infra/compose.yaml --project-directory infra config --services | grep -q .; then
          docker compose -f infra/compose.yaml --project-directory infra --profile check up -d --remove-orphans --wait;
        fi
    # 任务选项
    options:
      # 启用缓存
      cache: false
      # 进程超时（秒）
      timeout: 300
      # 经 shell 运行
      shell: false
      # 虚拟资源互斥锁
      mutex: "docker-compose"
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # 服务编排停止
  compose-down:
    # 运行命令
    command: "docker compose -f infra/compose.yaml --project-directory infra down --remove-orphans"
    # 任务选项
    options:
      # 启用缓存
      cache: false
      # 虚拟资源互斥锁
      mutex: "docker-compose"
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # 平台验收
  verify:
    # 运行命令
    command: "sh"
    # 命令参数
    args:
      - -c
      - >-
        start=$(( ($(date +%s) - 86400) * 1000000 )) && end=$(( ($(date +%s) + 3600) * 1000000 ))
        && if ! compgen -G 'infra/checks/*.hurl' > /dev/null; then exit 0; fi
        && exec hurl --variables-file infra/.env --variable start="$start" --variable end="$end" --glob 'infra/checks/*.hurl'
    # 前置任务
    deps:
      - "compose-up"
    # 任务选项
    options:
      # 启用缓存
      cache: false
      # CI 运行
      runInCI: true
      # 经 shell 运行
      shell: false
      # 从工作区根目录运行
      runFromWorkspaceRoot: true

  # Python 环境初始化
  setup-python:
    # 运行命令
    command: "uv sync --locked"

  # Ruff 检查
  ruff-check:
    # 运行命令
    command: "ruff check ."
    # 任务选项
    options:
      # CI 运行
      runInCI: false

  # Ruff 格式化
  ruff-format:
    # 运行命令
    command: "ruff format --check ."
    # 任务选项
    options:
      # CI 运行
      runInCI: false

  # Ruff 聚合
  ruff:
    # 前置任务
    deps:
      - "ruff-format"
      - "ruff-check"
    # 任务选项
    options:
      # CI 运行
      runInCI: false
      # 并行运行前置任务
      runDepsInParallel: false

  # TypeScript 环境初始化
  setup-typescript:
    # 运行命令
    command: "bun install --frozen-lockfile"

  # Oxlint 检查
  oxlint:
    # 运行命令
    command: "oxlint"
    # 命令参数
    args: ["--no-error-on-unmatched-pattern"]
    # 任务选项
    options:
      # CI 运行
      runInCI: false
