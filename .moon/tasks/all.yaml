# moon 全局任务 - https://moonrepo.dev/docs/config/tasks

# 任务
tasks:
  # 环境初始化
  setup:
    command: "moon sync vcs-hooks"
    deps:
      - "setup-tools"
    options:
      cache: false

  # 安装工具
  setup-tools:
    command: "mise install --locked"
    options:
      cache: false

  # 代码检查
  lint:
    deps:
      - "typos"
      - "oxfmt"
      - "no-pipe"
      - "zizmor"
      - "validate"
      - "gitleaks"
    options:
      runInCI: false

  # 拼写检查
  typos:
    command: "typos"
    options:
      runInCI: false

  # Oxfmt 检查
  oxfmt-check:
    command: "oxfmt --check ."
    options:
      runInCI: false
      runFromWorkspaceRoot: true

  # Oxfmt 格式化
  oxfmt-format:
    command: "oxfmt ."
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  # Oxfmt 聚合
  oxfmt:
    deps:
      - "oxfmt-format"
      - "oxfmt-check"
    options:
      runInCI: false
      runDepsInParallel: false

  # 管道检查
  no-pipe:
    command: "sh"
    args:
      - -c
      - >-
        rg --hidden -e "(curl|wget)\s+[^|\n]*\|\s*(sudo\s+)?(sh|bash|zsh|ksh|dash)(\s|$)" ; [ $? -eq 1 ]
    options:
      cache: false
      runInCI: false
      shell: false

  # 工作流审计
  zizmor:
    command: "zizmor .github/workflows"
    options:
      runInCI: false
      runFromWorkspaceRoot: true

  # 链接检查
  lychee:
    command: "lychee --config lychee.toml ."
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  # 配置校验
  validate:
    command: "validator renovate.json5"
    options:
      runInCI: false
      runFromWorkspaceRoot: true

  # 密钥扫描
  gitleaks:
    command: "gitleaks git --config .gitleaks.toml ."
    options:
      runInCI: false
      runFromWorkspaceRoot: true

  # 漏洞扫描
  trivy:
    command: "trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --config trivy.yaml ."
    options:
      runInCI: true
      runFromWorkspaceRoot: true

  # 契约聚合
  contracts:
    deps:
      - "openapi"

  # 契约检查
  openapi:
    command: "vacuum lint --ruleset contracts/http/vacuum.yaml contracts/http/openapi.yaml"
    options:
      runFromWorkspaceRoot: true

  # Compose 配置检查
  compose-config:
    command: "docker compose -f infra/compose.yaml --project-directory infra config --quiet"
    options:
      runInCI: true
      runFromWorkspaceRoot: true

  # Compose 误配扫描
  compose-misconfig:
    command: "trivy fs --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 --config trivy.yaml ."
    options:
      runInCI: true
      runFromWorkspaceRoot: true

  # 服务编排检查
  compose-check:
    deps:
      - "compose-config"
      - "compose-misconfig"
    options:
      runInCI: true

  # 服务编排启动
  compose-up:
    command: "sh"
    args:
      - -c
      - >-
        if docker compose -f infra/compose.yaml --project-directory infra config --services | grep -q .; then
          docker compose -f infra/compose.yaml --project-directory infra --profile check up -d --remove-orphans --wait;
        fi
    options:
      cache: false
      timeout: 300
      shell: false
      runFromWorkspaceRoot: true

  # 服务编排停止
  compose-down:
    command: "docker compose -f infra/compose.yaml --project-directory infra down --remove-orphans"
    options:
      cache: false
      runFromWorkspaceRoot: true

  # 平台验收
  verify:
    command: "sh"
    args:
      - -c
      - >-
        start=$(( ($(date +%s) - 86400) * 1000000 )) && end=$(( ($(date +%s) + 3600) * 1000000 ))
        && if ! compgen -G 'infra/checks/*.hurl' > /dev/null; then exit 0; fi
        && exec hurl --variables-file infra/.env --variable start="$start" --variable end="$end" --glob 'infra/checks/*.hurl'
    deps:
      - "compose-up"
    options:
      cache: false
      runInCI: true
      shell: false
      runFromWorkspaceRoot: true
