# Web 入口 - 同源托管 SPA 并反代 API
server {
  # 监听端口
  listen 80;
  # 服务名 - 由上层 Traefik 按域名路由
  server_name _;

  # 静态资源根目录
  root /usr/share/nginx/html;
  # 默认索引
  index index.html;

  # 请求体上限 - 与 API 上传限制对齐
  client_max_body_size 12m;

  # 统一反代请求头 - 透传客户端信息
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # SPA 回退 - 未命中静态资源时交给前端路由
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 健康检查
  location /healthz {
    # 不带 URI - 保留原始路径
    proxy_pass http://api:8000;
  }

  # 对象存储
  location /storage/ {
    # 不带 URI - 保留原始路径
    proxy_pass http://api:8000;
  }

  # 遥测上报
  location /telemetry/ {
    # 不带 URI - 保留原始路径
    proxy_pass http://api:8000;
  }

  # 工作流
  location /workflow/ {
    # 不带 URI - 保留原始路径
    proxy_pass http://api:8000;
  }

  # 实时通道 - 额外支持 WebSocket
  location /realtime/ {
    # 不带 URI - 保留原始路径
    proxy_pass http://api:8000;
    # HTTP/1.1 为 WebSocket 升级前提
    proxy_http_version 1.1;
    # 升级头
    proxy_set_header Upgrade $http_upgrade;
    # 连接头
    proxy_set_header Connection "upgrade";
    # 长连接读超时 - 覆盖 WebSocket 会话时长
    proxy_read_timeout 3600s;
  }
}
