# moon 项目 - https://moonrepo.dev/docs/config/project

# 语言
language: "typescript"

# 工具链
toolchains:
  javascript: {}
  bun: {}

# 标识
id: "miniapp"

# 任务
tasks:
  # 构建
  build:
    # 运行命令
    command: "bun run uni build -p mp-weixin"
    # 前置任务
    deps:
      - "setup-typescript"
    # 任务选项
    options:
      # 启用缓存
      cache: false

  # 体积检查
  size:
    # 运行命令
    command: "bun run size-limit"
    # 前置任务
    deps:
      - "setup-typescript"
      - "build"
    # 任务选项
    options:
      # 启用缓存
      cache: false

  # 小程序聚合
  miniapp:
    # 前置任务
    deps:
      - "typecheck"
      - "test"
      - "size"
    # 任务选项
    options:
      # CI 运行
      runInCI: true
