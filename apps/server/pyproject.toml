# 构建
[build-system]
# 构建后端
build-backend = "uv_build"
# 构建依赖
requires = ["uv_build>=0.13.7,<0.14.0"]

# 项目元数据
[project]
# 项目名
name = "server"
# 版本
version = "0.1.0"
# 描述
description = "Server 应用"
# Python 版本
requires-python = ">=3.12"
# 依赖
dependencies = [
  # Web 框架
  "fastapi>=0.141.1",
  # ASGI 服务器
  "granian>=2.8.2",
  # 配置管理
  "pydantic-settings>=2.15.0",
  # 数据校验
  "pydantic>=2.13.5",
  # 契约测试
  "schemathesis>=4.26.1",
  # 结构化日志
  "structlog>=25.4.0",
]

# 开发依赖
[dependency-groups]
# 开发
dev = ["datamodel-code-generator[black,isort]>=0.87.0", "pytest-asyncio>=1.3", "pytest-cov>=7.0", "pytest>=9.0"]

# 覆盖率采集
[tool.coverage.run]
# 分支覆盖率
branch = true
# 排除路径
omit = ["*/generated/*"]
# 统计范围
source = ["server"]

# 覆盖率报告
[tool.coverage.report]
# 排除行
exclude_lines = [
  # 抽象方法
  "@(abc\\\\.)?abstractmethod",
  # 仅类型检查分支
  "if TYPE_CHECKING:",
  # 脚本入口
  "if __name__ == .__main__.:",
  # 排除标记
  "pragma: no cover",
  # 未实现占位
  "raise NotImplementedError",
]

# pytest
[tool.pytest.ini_options]
# 选项
addopts = "--strict-markers --strict-config --cov --cov-branch --cov-report=term-missing --import-mode=importlib"
# 异步 fixture 作用域
asyncio_default_fixture_loop_scope = "function"
# 异步模式
asyncio_mode = "auto"
# 测试目录
testpaths = ["tests"]

# uv 构建后端
[tool.uv.build-backend]
# 模块名
module-name = "server"
