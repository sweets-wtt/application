# 项目元数据 - PEP 621
[project]
# 描述
description = "Server 应用"
# 项目名
name = "server"
# 支持的 Python 版本
requires-python = ">=3.12"
# 版本
version = "0.1.0"

# 依赖
dependencies = [
  # Web 框架
  "fastapi>=0.141.1",
  # 数据校验
  "pydantic>=2.13.5",
  # 配置管理
  "pydantic-settings>=2.15.0",
  # ASGI 服务器
  "granian>=2.8.2",
  # 契约测试
  "schemathesis>=4.26.1",
  # 结构化日志
  "structlog>=25.4.0",
  # ORM
  "sqlalchemy[asyncio]>=2.0.44",
  # SQLite 异步驱动
  "aiosqlite>=0.21",
  # 迁移
  "alembic>=1.16.6",
]

# 开发依赖 - lint 与类型检查工具由工作区根统一管理
[dependency-groups]
# 开发
dev = [
  "datamodel-code-generator[black,isort]>=0.87.0",
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.0",
]

# 构建
[build-system]
# 构建后端
build-backend = "uv_build"
# 构建依赖 - 限定主版本, 与当前 uv 版本对齐
requires = ["uv_build>=0.13.7,<0.14.0"]

# uv 构建后端选项
[tool.uv.build-backend]
# 模块名
module-name = "server"

# pytest - https://docs.pytest.org/
[tool.pytest.ini_options]
# importlib 模式允许非包目录下同名测试模块共存
addopts = "--strict-markers --strict-config --cov --cov-branch --cov-report=term-missing --import-mode=importlib"
# 异步 fixture 默认作用域
asyncio_default_fixture_loop_scope = "function"
# 异步测试自动处理模式
asyncio_mode = "auto"
# 测试目录
testpaths = ["tests"]

# coverage - https://coverage.readthedocs.io/
[tool.coverage.run]
# 分支覆盖率
branch = true
# 排除契约生成物
omit = ["*/generated/*"]
# 统计范围 - 只统计应用包
source = ["server"]

# 覆盖率报告
[tool.coverage.report]
# 排除不可覆盖分支 - 保留 coverage 默认项
exclude_lines = [
  # 显式排除标记
  "pragma: no cover",
  # 仅类型检查分支
  "if TYPE_CHECKING:",
  # 抽象占位实现
  "raise NotImplementedError",
  # 脚本入口
  "if __name__ == .__main__.:",
  # 抽象方法
  "@(abc\\.)?abstractmethod",
]
