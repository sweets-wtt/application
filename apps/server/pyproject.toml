[project]
name = "server"
version = "0.1.0"
description = "Server 应用"
requires-python = ">=3.12"

# 依赖
dependencies = [
  "fastapi>=0.141.1",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "granian>=2.8.2",
  "schemathesis>=4.26.1",
  "slowapi>=0.1.9",
  "structlog>=25.4.0",
]

# 开发依赖 - lint 与类型检查工具由工作区根统一管理
[dependency-groups]
dev = [
  "datamodel-code-generator>=0.87.0",
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.0",
]

# 构建
[build-system]
requires = ["uv_build>=0.12.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "server"

# pytest - https://docs.pytest.org/
[tool.pytest.ini_options]
# importlib 模式允许非包目录下同名测试模块共存
addopts = "--strict-markers --strict-config --cov --cov-branch --import-mode=importlib"
asyncio_mode = "auto"

# coverage - https://coverage.readthedocs.io/
[tool.coverage.run]
branch = true
