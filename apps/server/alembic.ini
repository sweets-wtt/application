# Alembic 配置 - https://alembic.sqlalchemy.org/en/latest/tutorial.html

# 迁移配置
[alembic]
# 脚本位置 %(here)s 为本文件所在目录
script_location = %(here)s/alembic
# 连接 URL 经 alembic/env.py 注入
sqlalchemy.url =

# 日志器清单
[loggers]
# 日志器键名
keys = root,sqlalchemy,alembic

# 处理器清单
[handlers]
# 处理器键名
keys = console

# 格式化器清单
[formatters]
# 格式化器键名
keys = generic

# 根日志器
[logger_root]
# 日志级别
level = WARNING
# 处理器
handlers = console
# 日志器名
qualname =

# SQLAlchemy 引擎日志器
[logger_sqlalchemy]
# 日志级别
level = WARNING
# 处理器
handlers =
# 日志器名
qualname = sqlalchemy.engine

# Alembic 日志器
[logger_alembic]
# 日志级别
level = INFO
# 处理器
handlers =
# 日志器名
qualname = alembic

# 控制台处理器
[handler_console]
# 处理器类
class = StreamHandler
# 初始化参数
args = (sys.stderr,)
# 日志级别
level = NOTSET
# 格式化器
formatter = generic

# 通用格式化器
[formatter_generic]
# 输出格式
format = %(levelname)-5.5s [%(name)s] %(message)s
# 时间格式
datefmt = %H:%M:%S
