# 默认规则
[default]
# 跳过二进制
binary = false
# 检查内容
check-file = true
# 检查文件名
check-filename = true
# 忽略正则
extend-ignore-re = ["[\"']?[A-Z]{2,5}[0-9]{3}[\"']?"]

# 文件
[files]
# 额外排除
extend-exclude = [
  # 锁文件
  "*.lock",
  # Python 生成物
  "apps/server/src/server/generated/**",
  # 自动导入声明
  "apps/web/auto-imports.d.ts",
  # TypeScript 生成物
  "apps/web/src/api/generated/**",
]
