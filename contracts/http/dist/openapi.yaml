# Generated by mise run bundle - do not edit manually
openapi: 3.1.2
info:
  title: API
  description: |
    HTTP 契约（源文件入口）。

    结构：`paths/` 按资源域一文件（与 server/routes 一一对应，
    多路径项文件内用语义键，如 `realtime.yaml#/ticket`）；
    `components/` 参数、请求体、响应与模式。
    修改源文件后执行 `mise run bundle` 重新打包 `dist/openapi.yaml` -
    制品是 datamodel-codegen / Orval / vacuum / oasdiff / schemathesis 的唯一消费入口。

    所有 JSON 成功响应使用统一的 `{code, message, data}` 信封；
    错误响应使用 FastAPI 默认的 `{detail}` 结构。

    实时 WebSocket 端点 `/realtime/ws` 以说明形式文档化，
    Orval 生成的 `connectRealtime` 仅为文档占位，不执行真实 WebSocket 握手。
  version: 0.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealthz
      description: 返回服务存活状态
      responses:
        '200':
          $ref: '#/components/responses/Healthz200'
  /storage/{key}:
    put:
      operationId: putStorage
      description: 流式上传对象 - 请求体为原始二进制、最大 10 MiB
      parameters:
        - $ref: '#/components/parameters/Key'
        - $ref: '#/components/parameters/Tenant'
      requestBody:
        $ref: '#/components/requestBodies/BinaryContent'
      responses:
        '200':
          $ref: '#/components/responses/StoragePut200'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: getStorage
      description: 流式下载对象 - 响应体为原始二进制
      parameters:
        - $ref: '#/components/parameters/Key'
        - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          $ref: '#/components/responses/StorageGet200'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /realtime/ticket:
    post:
      operationId: createTicket
      description: 签发一次性 WebSocket 票据 - 有效期内通过 /realtime/ws 消费一次
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          $ref: '#/components/responses/RealtimeTicket200'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /realtime/ws:
    get:
      operationId: connectRealtime
      description: |
        WebSocket 升级端点（HTTP 101 Switching Protocols）。

        握手参数：`ticket` 为 `/realtime/ticket` 签发的一次性票据；
        `Origin` 缺失放行，存在时必须命中允许列表。

        会话协议：
        - 连接后服务端先发送 `{"type":"system","topic":"system","payload":{"status":"connected"}}`；
        - 心跳：客户端发送纯文本 `ping`，服务端回复纯文本 `pong`；
        - 订阅：`{"type":"subscribe","topic":"<topic>"}`；
        - 取消订阅：`{"type":"unsubscribe","topic":"<topic>"}`；
        - 发布：`{"type":"publish","topic":"<topic>","payload":{...}}`；
        - 事件：`{"type":"event","topic":"<topic>","payload":{...}}`。

        关闭码：`4401` 票据无效、`4403` 来源拒绝、`4503` 票据存储不可用。

        说明：Orval 生成的 `connectRealtime` 仅为文档占位，不执行真实 WebSocket 握手。
      parameters:
        - $ref: '#/components/parameters/Ticket'
        - $ref: '#/components/parameters/Origin'
      responses:
        '101':
          description: 协议升级成功 - 进入 WebSocket 会话
        '404':
          description: 普通 HTTP 请求无法匹配 WebSocket 路由
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /telemetry/events:
    post:
      operationId: ingestTelemetry
      description: 批量接收前端遥测事件 - 请求体上限 256 KiB
      requestBody:
        $ref: '#/components/requestBodies/TelemetryBatch'
      responses:
        '202':
          $ref: '#/components/responses/TelemetryEvents202'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workflow/runs:
    post:
      operationId: createWorkflowRun
      description: 提交工作流 run - 以 Idempotency-Key 保证幂等
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/WorkflowInput'
      responses:
        '202':
          $ref: '#/components/responses/WorkflowRuns202'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workflow/runs/{run_id}:
    get:
      operationId: getWorkflowRun
      description: 查询工作流 run 状态
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowRun200'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  schemas:
    Response:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
      additionalProperties: false
    Error:
      description: 通用错误响应 - 与 FastAPI HTTPException 一致
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
      additionalProperties: false
    ValidationErrorItem:
      description: FastAPI 请求校验错误条目
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
      additionalProperties: true
    ValidationError:
      description: FastAPI 请求校验失败响应
      type: object
      required:
        - detail
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
      additionalProperties: false
    StorageObject:
      description: 已写入对象的位置与字节数
      type: object
      required:
        - key
        - size
      properties:
        key:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    RealtimeTicket:
      description: 一次性 WebSocket 票据及过期时间
      type: object
      required:
        - ticket
        - expiresAtMs
      properties:
        ticket:
          type: string
          maxLength: 256
        expiresAtMs:
          type: integer
          format: int64
      additionalProperties: false
    TelemetryEvent:
      description: 单条前端遥测事件 - 批量载荷中 events 的元素
      type: object
      required:
        - level
        - fingerprint
        - message
        - timestamp
      properties:
        level:
          type: string
          enum:
            - debug
            - info
            - warn
            - error
        fingerprint:
          type: string
          maxLength: 1024
        message:
          type: string
          maxLength: 8192
        timestamp:
          type: integer
        context:
          type:
            - object
            - 'null'
          additionalProperties: true
      additionalProperties: false
    TelemetryBatch:
      description: 前端 logger 批量上报的目标结构 - 端与版本在批次级、事件在 events 中
      type: object
      required:
        - service
        - release
        - events
      properties:
        service:
          type: string
          enum:
            - web
            - miniapp
        release:
          type: string
          maxLength: 128
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TelemetryEvent'
      additionalProperties: false
    TelemetryAccepted:
      type: object
      required:
        - accepted
      properties:
        accepted:
          type: integer
      additionalProperties: false
    WorkflowInput:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          maxLength: 8192
      additionalProperties: false
    WorkflowRunAccepted:
      type: object
      required:
        - run_id
        - status
      properties:
        run_id:
          type: string
        status:
          type: string
          enum:
            - submitted
      additionalProperties: false
    WorkflowRunStatus:
      description: 工作流 run 状态 - 与 worker 状态回写一致
      type: string
      enum:
        - submitted
        - running
        - succeeded
        - failed
  responses:
    Healthz200:
      description: 存活
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - properties:
                  data:
                    type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                    additionalProperties: false
    StorageGet200:
      description: 对象内容
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: 请求校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    StoragePut200:
      description: 已写入
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - properties:
                  data:
                    $ref: '#/components/schemas/StorageObject'
    PayloadTooLarge:
      description: 请求体超过上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RealtimeTicket200:
      description: 票据已签发
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - properties:
                  data:
                    $ref: '#/components/schemas/RealtimeTicket'
    Forbidden:
      description: 来源不在允许列表
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 票据存储不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TelemetryEvents202:
      description: 已受理
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - properties:
                  data:
                    $ref: '#/components/schemas/TelemetryAccepted'
    BadRequest:
      description: 请求体解析失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WorkflowRuns202:
      description: 已受理
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - properties:
                  data:
                    $ref: '#/components/schemas/WorkflowRunAccepted'
    WorkflowRun200:
      description: 查询成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - properties:
                  data:
                    $ref: '#/components/schemas/WorkflowRunStatus'
  parameters:
    Key:
      name: key
      in: path
      required: true
      description: 对象键（允许包含路径分隔符）
      schema:
        type: string
    Tenant:
      name: x-tenant
      in: header
      required: true
      description: 租户标识 - 作为对象键前缀
      schema:
        type: string
    Origin:
      name: Origin
      in: header
      required: false
      description: 请求来源 - 缺失放行，存在时必须命中允许列表
      schema:
        type: string
    Ticket:
      name: ticket
      in: query
      required: true
      description: 一次性票据 - 握手时消费
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    BinaryContent:
      required: true
      description: 二进制对象内容
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    TelemetryBatch:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TelemetryBatch'
    WorkflowInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowInput'
