# Generated by mise run bundle - do not edit manually
openapi: 3.1.2
info:
  title: API
  description: |
    HTTP 契约（源文件入口）。

    结构：`paths/` 按资源域一文件（与 server/routes 一一对应，
    多路径项文件内用语义键，如 `workflow.yaml#/runs`）；
    `components/` 参数、请求体、响应与模式。
    修改源文件后执行 `mise run bundle` 重新打包 `dist/openapi.yaml` -
    制品是 datamodel-codegen / Orval / vacuum / oasdiff / schemathesis 的唯一消费入口。

    所有 JSON 成功响应使用统一的 `{code, message, data}` 信封；
    错误响应使用 FastAPI 默认的 `{detail}` 结构。
  version: 0.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
paths:
  /auth/login:
    get:
      operationId: authLogin
      description: 跳转 Casdoor 登录页
      parameters:
        - name: next
          in: query
          required: false
          description: 登录后站内跳转路径
          schema:
            type: string
      responses:
        '302':
          $ref: '#/components/responses/AuthRedirect'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /auth/callback:
    get:
      operationId: authCallback
      description: Casdoor 授权码回调
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '303':
          $ref: '#/components/responses/AuthRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
  /auth/logout:
    get:
      operationId: authLogout
      description: 清除会话并跳转 Casdoor 登出
      responses:
        '303':
          $ref: '#/components/responses/AuthRedirect'
    post:
      operationId: authLogoutSession
      description: 仅清除本地会话
      responses:
        '200':
          $ref: '#/components/responses/AuthLogout200'
  /auth/me:
    get:
      operationId: authMe
      description: 查询当前登录用户
      responses:
        '200':
          $ref: '#/components/responses/AuthMe200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /healthz:
    get:
      operationId: getHealthz
      description: 返回服务存活状态
      responses:
        '200':
          $ref: '#/components/responses/Healthz200'
  /telemetry/events:
    post:
      operationId: ingestTelemetry
      description: 批量接收前端遥测事件 - 请求体上限 256 KiB
      requestBody:
        $ref: '#/components/requestBodies/TelemetryBatch'
      responses:
        '202':
          $ref: '#/components/responses/TelemetryEvents202'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workflow/runs:
    post:
      operationId: createWorkflowRun
      description: 提交工作流 run - 以 Idempotency-Key 保证幂等
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/WorkflowInput'
      responses:
        '202':
          $ref: '#/components/responses/WorkflowRuns202'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workflow/runs/{run_id}:
    get:
      operationId: getWorkflowRun
      description: 查询工作流 run 状态
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowRun200'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  schemas:
    AuthRedirect:
      description: 认证跳转 - 空响应体
      type: object
      additionalProperties: false
    Error:
      description: 通用错误响应 - 与 FastAPI HTTPException 一致
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
      additionalProperties: false
    Response:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
      additionalProperties: false
    AuthUser:
      description: 当前登录用户与权限
      type: object
      required:
        - user_id
        - tenant_id
        - roles
        - permissions
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
        email:
          type:
            - string
            - 'null'
        name:
          type:
            - string
            - 'null'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
      additionalProperties: false
    TelemetryEvent:
      description: 单条前端遥测事件 - 批量载荷中 events 的元素
      type: object
      required:
        - level
        - fingerprint
        - message
        - timestamp
      properties:
        level:
          type: string
          enum:
            - debug
            - info
            - warn
            - error
        fingerprint:
          type: string
          maxLength: 1024
        message:
          type: string
          maxLength: 8192
        timestamp:
          type: integer
        context:
          type:
            - object
            - 'null'
          additionalProperties: true
      additionalProperties: false
    TelemetryBatch:
      description: 前端 logger 批量上报的目标结构 - 端与版本在批次级、事件在 events 中
      type: object
      required:
        - service
        - release
        - events
      properties:
        service:
          type: string
          enum:
            - web
            - miniapp
        release:
          type: string
          maxLength: 128
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TelemetryEvent'
      additionalProperties: false
    TelemetryAccepted:
      type: object
      required:
        - accepted
      properties:
        accepted:
          type: integer
      additionalProperties: false
    ValidationErrorItem:
      description: FastAPI 请求校验错误条目
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
      additionalProperties: true
    ValidationError:
      description: FastAPI 请求校验失败响应
      type: object
      required:
        - detail
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
      additionalProperties: false
    WorkflowInput:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          maxLength: 8192
      additionalProperties: false
    WorkflowRunAccepted:
      type: object
      required:
        - run_id
        - status
      properties:
        run_id:
          type: string
        status:
          type: string
          enum:
            - submitted
      additionalProperties: false
    WorkflowRunStatus:
      description: 工作流 run 状态 - 与 worker 状态回写一致
      type: string
      enum:
        - submitted
        - running
        - succeeded
        - failed
    WorkflowRun:
      type: object
      required:
        - run_id
        - status
      properties:
        run_id:
          type: string
        status:
          $ref: '#/components/schemas/WorkflowRunStatus'
      additionalProperties: false
  responses:
    AuthRedirect:
      description: 跳转认证服务
      headers:
        Location:
          description: 跳转地址
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthRedirect'
    AuthUnavailable:
      description: 认证未启用或未配置
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: 请求体解析失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未认证或令牌无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: 认证服务不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthLogout200:
      description: 已清除会话
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - properties:
                  data:
                    type: object
                    additionalProperties: false
    AuthMe200:
      description: 当前登录用户
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - properties:
                  data:
                    $ref: '#/components/schemas/AuthUser'
    Healthz200:
      description: 存活
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - properties:
                  data:
                    type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                    additionalProperties: false
    TelemetryEvents202:
      description: 已受理
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - properties:
                  data:
                    $ref: '#/components/schemas/TelemetryAccepted'
    PayloadTooLarge:
      description: 请求体超过上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: 请求校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    WorkflowRuns202:
      description: 已受理
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - properties:
                  data:
                    $ref: '#/components/schemas/WorkflowRunAccepted'
    WorkflowRun200:
      description: 查询成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - properties:
                  data:
                    $ref: '#/components/schemas/WorkflowRun'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  requestBodies:
    TelemetryBatch:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TelemetryBatch'
    WorkflowInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowInput'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
