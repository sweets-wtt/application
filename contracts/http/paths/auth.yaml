# 认证 - /auth/*
# 登录跳转
login:
  get:
    operationId: authLogin
    description: 跳转 Casdoor 登录页
    parameters:
      - name: next
        in: query
        required: false
        description: 登录后站内跳转路径
        schema:
          type: string
    responses:
      "302":
        $ref: "../components/responses.yaml#/responses/AuthRedirect"
      "503":
        $ref: "../components/responses.yaml#/responses/AuthUnavailable"

# 登录回调
callback:
  get:
    operationId: authCallback
    description: Casdoor 授权码回调
    parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
    responses:
      "303":
        $ref: "../components/responses.yaml#/responses/AuthRedirect"
      "400":
        $ref: "../components/responses.yaml#/responses/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/responses/Unauthorized"
      "502":
        $ref: "../components/responses.yaml#/responses/BadGateway"

# 登出
logout:
  get:
    operationId: authLogout
    description: 清除会话并跳转 Casdoor 登出
    responses:
      "303":
        $ref: "../components/responses.yaml#/responses/AuthRedirect"
  post:
    operationId: authLogoutSession
    description: 仅清除本地会话
    responses:
      "200":
        $ref: "../components/responses.yaml#/responses/AuthLogout200"

# 当前用户
me:
  get:
    operationId: authMe
    description: 查询当前登录用户
    responses:
      "200":
        $ref: "../components/responses.yaml#/responses/AuthMe200"
      "401":
        $ref: "../components/responses.yaml#/responses/Unauthorized"
