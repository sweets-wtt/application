# 工作流 - /workflow/*
# 提交 run
runs:
  post:
    operationId: workflowRuns
    description: 提交工作流 run - 以 Idempotency-Key 保证幂等
    parameters:
      - $ref: "../components/parameters.yaml#/parameters/IdempotencyKeyHeader"
    requestBody:
      $ref: "../components/requestBodies.yaml#/requestBodies/WorkflowInput"
    responses:
      "202":
        $ref: "../components/responses.yaml#/responses/WorkflowRuns202"
      "400":
        $ref: "../components/responses.yaml#/responses/BadRequest"
      "422":
        $ref: "../components/responses.yaml#/responses/UnprocessableEntity"

# 查询 run
run:
  get:
    operationId: workflowRun
    description: 查询工作流 run 状态
    parameters:
      - $ref: "../components/parameters.yaml#/parameters/RunIdPath"
    responses:
      "200":
        $ref: "../components/responses.yaml#/responses/WorkflowRun200"
      "404":
        $ref: "../components/responses.yaml#/responses/NotFound"
      "422":
        $ref: "../components/responses.yaml#/responses/UnprocessableEntity"
