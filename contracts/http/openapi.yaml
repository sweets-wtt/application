# OpenAPI - https://spec.openapis.org/

# 规范版本
openapi: 3.1.2

# 接口信息
info:
  # 标题
  title: API
  # 描述
  description: HTTP 契约
  # 版本
  version: 0.1.0

# JSON Schema 方言
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"

# 服务器
servers:
  - url: /

# 可复用组件
components:
  schemas:
    # 标准响应
    Response:
      # 类型
      type: object
      # 必填属性
      required:
        - code
        - message
        - data
      # 属性
      properties:
        # 状态码
        code:
          # 类型
          type: integer
        # 消息
        message:
          # 类型
          type: string
        # 数据
        data:
          # 类型
          type: object
      # 禁止附加属性
      additionalProperties: false

    # 遥测事件
    TelemetryEvent:
      # 类型
      type: object
      # 必填属性
      required:
        - level
        - fingerprint
        - message
        - timestamp
      # 属性
      properties:
        # 级别
        level:
          # 类型
          type: string
          # 枚举
          enum:
            - error
            - warn
            - info
        # 指纹
        fingerprint:
          # 类型
          type: string
          # 最大长度
          maxLength: 64
        # 消息
        message:
          # 类型
          type: string
          # 最大长度
          maxLength: 512
        # 时间戳
        timestamp:
          # 类型
          type: string
          # 格式
          format: date-time
        # 上下文
        context:
          # 类型
          type: object
          # 键数上限
          maxProperties: 16
          # 附加属性
          additionalProperties:
            # 类型
            type: string
            # 最大长度
            maxLength: 256
      # 禁止附加属性
      additionalProperties: false

    # 遥测事件批量
    TelemetryEventsRequest:
      # 类型
      type: object
      # 必填属性
      required:
        - service
        - release
        - events
      # 属性
      properties:
        # 服务
        service:
          # 类型
          type: string
          # 枚举
          enum:
            - web
            - miniapp
        # 版本号
        release:
          # 类型
          type: string
          # 最大长度
          maxLength: 64
        # 事件批量
        events:
          # 类型
          type: array
          # 条数上限
          maxItems: 100
          # 事件
          items:
            # 引用
            $ref: "#/components/schemas/TelemetryEvent"
      # 禁止附加属性
      additionalProperties: false

# 路径
paths:
  # 存活探针
  /healthz:
    # 检查存活
    get:
      # 操作标识
      operationId: healthz
      # 响应
      responses:
        # 成功响应
        "200":
          # 描述
          description: 存活
          # 内容
          content:
            application/json:
              # 模式
              schema:
                # 全部满足
                allOf:
                  - $ref: "#/components/schemas/Response"
                  # 属性
                  - properties:
                      # 数据
                      data:
                        # 类型
                        type: object
                        # 必填属性
                        required:
                          - status
                        # 属性
                        properties:
                          # 状态
                          status:
                            # 类型
                            type: string
                        # 禁止附加属性
                        additionalProperties: false

  # 遥测事件
  /telemetry/events:
    # 接收遥测事件
    post:
      # 操作标识
      operationId: createTelemetryEvents
      # 描述
      description: 接收客户端批量遥测事件
      # 请求体
      requestBody:
        # 必填
        required: true
        # 内容
        content:
          application/json:
            # 模式
            schema:
              # 引用
              $ref: "#/components/schemas/TelemetryEventsRequest"
      # 响应
      responses:
        # 已接受
        "202":
          # 描述
          description: 已接受
          # 内容
          content:
            application/json:
              # 模式
              schema:
                # 全部满足
                allOf:
                  # 标准响应
                  - $ref: "#/components/schemas/Response"
                  # 属性
                  - properties:
                      # 数据
                      data:
                        # 类型
                        type: object
                        # 必填属性
                        required:
                          - accepted
                        # 属性
                        properties:
                          # 接受条数
                          accepted:
                            # 类型
                            type: integer
                        # 禁止附加属性
                        additionalProperties: false
        # 请求体超限
        "413":
          # 描述
          description: 请求体超限
        # 请求体非法
        "400":
          # 描述
          description: 请求体无法解析
