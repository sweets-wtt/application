# 规范版本
openapi: 3.1.2

# 接口信息
info:
  # 标题
  title: API
  # 描述
  description: |
    HTTP 契约（源文件入口）。

    结构：`paths/` 每路径一文件；`components/` 参数、响应与模式。
    修改源文件后执行 `just bundle` 重新打包 `dist/openapi.yaml` -
    制品是 datamodel-codegen / Orval / vacuum / oasdiff / schemathesis 的唯一消费入口。

    所有 JSON 成功响应使用统一的 `{code, message, data}` 信封；
    错误响应使用 FastAPI 默认的 `{detail}` 结构。

    实时 WebSocket 端点 `/realtime/ws` 以说明形式文档化，
    Orval 生成的 `realtimeWs` 仅为文档占位，不执行真实 WebSocket 握手。
  # 版本
  version: 0.1.0

# JSON Schema 方言
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"

# 服务器
servers:
  - url: /

# 路径 - 每路径项一文件（Redocly split 结构）
paths:
  /healthz:
    $ref: "./paths/healthz.yaml"
  /storage/{key}:
    $ref: "./paths/storage@{key}.yaml"
  /realtime/ticket:
    $ref: "./paths/realtime@ticket.yaml"
  /realtime/ws:
    $ref: "./paths/realtime@ws.yaml"
  /telemetry/events:
    $ref: "./paths/telemetry@events.yaml"
  /workflow/runs:
    $ref: "./paths/workflow@runs.yaml"
  /workflow/runs/{run_id}:
    $ref: "./paths/workflow@runs@{run_id}.yaml"
