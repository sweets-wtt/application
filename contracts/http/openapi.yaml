# 规范版本
openapi: 3.1.2

# 接口信息
info:
  # 标题
  title: API
  # 描述
  description: |
    HTTP 契约（源文件入口）。

    结构：`paths/` 按资源域一文件（与 server/routes 一一对应，
    多路径项文件内用语义键，如 `workflow.yaml#/runs`）；
    `components/` 参数、请求体、响应与模式。
    修改源文件后执行 `mise run bundle` 重新打包 `dist/openapi.yaml` -
    制品是 datamodel-codegen / Orval / vacuum / oasdiff / schemathesis 的唯一消费入口。

    所有 JSON 成功响应使用统一的 `{code, message, data}` 信封；
    错误响应使用 FastAPI 默认的 `{detail}` 结构。
  # 版本
  version: 0.1.0

# JSON Schema 方言
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"

# 服务器
servers:
  - url: /

# 路径 - 按资源域一文件（与 server/routes 一一对应；单路径项整文件引用，多路径项用语义键）
paths:
  /auth/login:
    $ref: "./paths/auth.yaml#/login"
  /auth/callback:
    $ref: "./paths/auth.yaml#/callback"
  /auth/logout:
    $ref: "./paths/auth.yaml#/logout"
  /auth/me:
    $ref: "./paths/auth.yaml#/me"
  /healthz:
    $ref: "./paths/healthz.yaml"
  /telemetry/events:
    $ref: "./paths/telemetry.yaml"
  /workflow/runs:
    $ref: "./paths/workflow.yaml#/runs"
  /workflow/runs/{run_id}:
    $ref: "./paths/workflow.yaml#/run"
