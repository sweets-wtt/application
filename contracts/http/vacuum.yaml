# vacuum - https://quobix.com/vacuum/rulesets/

# 规则集继承
extends: [[vacuum:oas, recommended]]

# 规则
rules:
  # 敏感字段禁例
  no-sensitive-examples:
    description: 敏感字段禁止示例与默认值
    severity: error
    given:
      - "$..password"
      - "$..secret"
      - "$..token"
    then:
      - field: example
        function: falsy
      - field: examples
        function: falsy
      - field: default
        function: falsy
