# vacuum - https://quobix.com/vacuum/rulesets/

# 规则集继承
extends: [[vacuum:oas, recommended]]

# 规则
rules:
  # 敏感字段禁例
  no-sensitive-examples:
    # 描述
    description: 敏感字段禁止示例与默认值
    # 严重级别
    severity: error
    # 作用目标
    given:
      - "$..password"
      - "$..secret"
      - "$..token"
    # 断言
    then:
      - field: example
        function: falsy
      - field: examples
        function: falsy
      - field: default
        function: falsy
