# 继承的规则集
extends: [[vacuum:oas, recommended]]

# 规则
# 仅列出与 vacuum recommended 默认严重级别不同的规则；
# 与默认一致的规则由 extends 继承，无需重复声明（重复声明不改变行为，只会制造噪音）
rules:
  # ── 文档结构与元信息 ──

  # OpenAPI 2 须声明非空 host（默认 info，收紧为 error）
  oas2-api-host: error
  # OpenAPI 2 须声明非空 schemes（默认 warn，收紧为 error）
  oas2-api-schemes: error
  # host 不得指向 example.com（默认 warn，收紧为 error）
  oas2-host-not-example: error
  # host 不得以斜杠结尾（默认 warn，收紧为 error）
  oas2-host-trailing-slash: error
  # servers 定义须合法（默认 warn，收紧为 error）
  oas3-api-servers: error

  # ── Schema 与类型 ──

  # schema 属性名须使用 camelCase（默认 warn，收紧为 error）
  camel-case-properties: error
  # 描述不得重复（默认 info，收紧为 error）
  description-duplication: error
  # 单元素组合器应直接内联（默认 warn，收紧为 error）
  no-unnecessary-combinator: error
  # 可空枚举须显式包含 null（默认 warn，收紧为 error）
  nullable-enum-contains-null: error
  # schema 及其属性须声明 type（默认 info，收紧为 error）
  oas-missing-type: error
  # 枚举值须符合声明类型（默认 warn，收紧为 error）
  typed-enum: error

  # ── 路径与操作 ──

  # 路径段不得包含 HTTP 动词（默认 warn，收紧为 error）
  no-http-verbs-in-path: error
  # 操作须包含描述（默认 warn，收紧为 error）
  operation-description: error
  # 操作须至少包含一个 2xx 或 3xx 响应（默认 warn，收紧为 error）
  operation-success-response: error
  # 操作 tag 须在全局 tags 中定义（默认 warn，收紧为 error）
  operation-tag-defined: error
  # path item 内的操作不得使用 $ref（默认 warn，收紧为 error）
  path-item-refs: error
  # 路径不得以斜杠结尾（默认 warn，收紧为 error）
  path-keys-no-trailing-slash: error
  # 路径段须使用 kebab-case（默认 warn，收紧为 error）
  paths-kebab-case: error

  # ── 示例与安全 ──

  # GET 与 DELETE 不应接受请求体（默认 warn，收紧为 error）
  no-request-body: error
  # formData 参数须在 consumes 中声明对应类型（默认 warn，收紧为 error）
  oas2-operation-formData-consume-check: error
  # 示例的 value 与 externalValue 互斥（默认 warn，收紧为 error）
  oas3-example-external-check: error
  # 参数须包含描述（默认 warn，收紧为 error）
  oas3-parameter-description: error
  # 示例须符合对应 schema（默认 warn，收紧为 error）
  oas3-valid-schema-example: error

  # ── 引用与清理 ──

  # x-zally-ignore 应迁移为 x-lint-ignore（默认 warn，收紧为 error）
  migrate-zally-ignore: error
  # 参数须包含描述（默认 warn，收紧为 error）
  oas2-parameter-description: error
  # 禁止未使用的定义与失效引用（默认 warn，收紧为 error）
  oas2-unused-definition: error
  # 禁止未使用的组件与失效引用（默认 warn，收紧为 error）
  oas3-unused-component: error

  # ── 项目自定义规则 ──

  # 敏感字段禁止提供示例与默认值
  no-sensitive-examples:
    # 规则描述
    description: 敏感字段禁止示例与默认值
    # 违规级别
    severity: error
    # 作用目标：敏感字段（覆盖常见命名变体）
    given:
      - "$..password"
      - "$..passwd"
      - "$..secret"
      - "$..clientSecret"
      - "$..token"
      - "$..accessToken"
      - "$..refreshToken"
      - "$..apiKey"
      - "$..privateKey"
      - "$..authorization"
      - "$..credential"
      - "$..credentials"
    # 断言：示例与默认值均不得出现
    then:
      - field: example
        function: falsy
      - field: examples
        function: falsy
      - field: default
        function: falsy
