# 设置
[settings]
# 锁文件
lockfile = true
# 严格模式
locked = true
# 自动安装
auto_install = false
# 缺失自动安装
not_found_auto_install = false

# 工具
[tools]
"aqua:Boeing/config-file-validator" = "2.3.0"
"aqua:dprint/dprint" = "0.58.0"
"aqua:crate-ci/typos" = "1.51.1"
"aqua:cocogitto/cocogitto" = "7.0.0"
"aqua:evilmartians/lefthook" = "2.2.1"

# 任务
[tasks.install]
description = "安装"
depends = [
  "install:tools",
]

[tasks."install:tools"]
description = "安装工具"
run = [
  "mise install --locked",
  "lefthook install",
]

[tasks.lint]
description = "检查"
depends = [
  "lint:validate",
  "lint:format",
  "lint:spell",
]

[tasks."lint:validate"]
description = "配置校验"
run = [
  "validator",
]

[tasks."lint:format"]
description = "格式检查"
run = [
  "dprint check --allow-no-files",
]

[tasks."lint:spell"]
description = "拼写检查"
run = [
  "typos --force-exclude",
]

[tasks.format]
description = "格式化"
depends = [
  "format:dprint",
]

[tasks."format:dprint"]
description = "代码格式"
run = [
  "dprint fmt",
]
