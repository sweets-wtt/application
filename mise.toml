# 设置
[settings]
# 锁文件
lockfile = true
# 严格锁定
locked = true
# 自动安装
auto_install = false
# 缺失自动安装
not_found_auto_install = false
# 系统回退
not_found_system_fallback = false

# 工具
[tools]
"aqua:dprint/dprint" = "0.57.4"
"aqua:crate-ci/typos" = "1.50.1"
"aqua:cocogitto/cocogitto" = "7.0.0"
"aqua:evilmartians/lefthook" = "2.1.14"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:aquasecurity/trivy" = "0.74.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.0"
"aqua:daveshanley/vacuum" = "0.30.3"
"github:tufin/oasdiff" = "v1.31.0"
"aqua:astral-sh/uv" = "0.12.10"
bun = "1.4.2"

# 环境变量
[env]
# 编排参数
COMPOSE = "podman compose -f infra/compose.yaml -p application"

# 任务全局配置
[task_config]
# 全局 shell - 统一支持 glob 与复合命令
shell = "bash -c"

# 任务
[tasks]

[tasks.default]
run = "mise tasks ls"
description = "列出任务"

[tasks.install]
description = "安装"
depends = ["install:python", "install:typescript"]

[tasks."install:tools"]
run = "mise install --locked"
description = "安装工具"

[tasks."install:python"]
run = "uv sync --locked"
dir = "apps/server"
description = "安装 Python"
depends = ["install:tools"]

[tasks."install:typescript"]
run = "bun install --frozen-lockfile"
description = "安装 TypeScript"
depends = ["install:tools"]

[tasks.lint]
description = "检查"
depends = [
  "lint:format",
  "lint:spell",
  "lint:secret",
  "lint:github",
  "lint:compose",
  "lint:python",
  "lint:typescript",
  "lint:app",
]

[tasks."lint:format"]
run = "dprint check"
description = "检查代码格式"

[tasks."lint:spell"]
run = "typos"
description = "检查拼写"

[tasks."lint:secret"]
run = "gitleaks git --config .gitleaks.toml ."
description = "扫描泄露密钥"

[tasks."lint:github"]
run = ["actionlint", "zizmor .github"]
description = "检查 GitHub 工作流"

[tasks."lint:compose"]
run = "$COMPOSE config --quiet"
description = "校验编排"

[tasks."lint:python"]
run = [
  "uv run ruff format --check .",
  "uv run ruff check .",
  "uv run ty check .",
]
dir = "apps/server"
description = "检查 Python"
sources = [
  "apps/server/**/*.py",
  "apps/server/pyproject.toml",
  "apps/server/uv.lock",
]

[tasks."lint:typescript"]
run = [
  """bunx oxfmt --check --no-error-on-unmatched-pattern '**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'""",
  "bunx oxlint --no-error-on-unmatched-pattern",
  "bunx tsc -p apps/web/tsconfig.json --noEmit",
]
description = "检查 TypeScript"
sources = [
  "apps/web/**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,vue,html}",
  "tsconfig*.json",
  "bun.lock",
]

[tasks."lint:app"]
run = "bun run --filter @app/web typecheck"
description = "检查应用类型"

[tasks."lint:api"]
run = "vacuum lint --ruleset contracts/http/vacuum.yaml contracts/http/dist/openapi.yaml"
description = "校验契约"

[tasks.format]
description = "格式化"
depends = ["format:code", "format:python", "format:ts"]

[tasks."format:code"]
run = "dprint fmt"
description = "格式化通用文件"

[tasks."format:python"]
run = "uv run ruff format ."
description = "格式化 Python"

[tasks."format:ts"]
run = """bunx oxfmt --no-error-on-unmatched-pattern '**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'"""
description = "格式化 TypeScript"

[tasks.audit]
description = "审计"
depends = ["audit:vuln", "audit:config"]

[tasks."audit:vuln"]
run = "trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 ."
description = "扫描依赖漏洞"

[tasks."audit:config"]
run = "trivy fs --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 ."
description = "扫描配置漏洞"

[tasks.ci]
description = "集成检查"
depends = ["lint", "audit"]

[tasks.build]
description = "构建前端产物"
depends = ["build:web"]

[tasks."build:web"]
run = "bun run --filter @app/web build"
description = "构建前端产物"
sources = [
  "apps/web/**",
  "tsconfig*.json",
  "bun.lock",
  "package.json",
]
outputs = ["apps/web/dist/**"]

[tasks."build:image"]
description = "构建应用镜像"
depends = ["build:image:server", "build:image:web"]

[tasks."build:image:server"]
run = "podman build -f apps/server/Dockerfile -t ${REGISTRY:-}server:${TAG:-latest} ."
description = "构建 Server 镜像"

[tasks."build:image:web"]
run = "podman build -f apps/web/Dockerfile -t ${REGISTRY:-}web:${TAG:-latest} ."
description = "构建 Web 镜像"

[tasks.test]
description = "测试"
depends = ["test:python", "test:js"]

[tasks."test:python"]
run = "uv run --locked pytest"
dir = "apps/server"
description = "测试 Python"
sources = [
  "apps/server/**/*.py",
  "apps/server/pyproject.toml",
  "apps/server/uv.lock",
]

[tasks."test:js"]
run = "bun run --filter @app/* test"
description = "测试 TypeScript"
sources = [
  "apps/web/**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,vue,html}",
  "tsconfig*.json",
  "bun.lock",
]

[tasks."test:e2e"]
run = "bun x playwright test"
dir = "apps/web"
description = "测试端到端"
depends = ["build:web"]

[tasks.bundle]
run = [
  "mkdir -p contracts/http/dist",
  "bun x @redocly/cli bundle contracts/http/openapi.yaml --output contracts/http/dist/openapi.yaml",
  '''uv run --project apps/server python -c "from pathlib import Path; p=Path('contracts/http/dist/openapi.yaml'); data=p.read_bytes().replace(b'\r\n', b'\n'); banner=b'# Generated by mise run bundle - do not edit manually\n'; p.write_bytes(data if data.startswith(banner) else banner + data)"''',
]
description = "打包契约制品"
sources = [
  "contracts/http/components/**/*.yaml",
  "contracts/http/paths/**/*.yaml",
  "contracts/http/openapi.yaml",
]
outputs = ["contracts/http/dist/openapi.yaml"]

[tasks.codegen]
description = "生成契约代码"
depends = ["codegen:py", "codegen:ts"]

[tasks."codegen:py"]
run = [
  "uv run --locked --project apps/server datamodel-codegen --input contracts/http/dist/openapi.yaml --output apps/server/src/server/contracts.py --disable-timestamp --openapi-scopes paths --strict-types int",
  '''uv run --project apps/server python -c "from pathlib import Path; p=Path('apps/server/src/server/contracts.py'); p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))"''',
]
description = "生成 Python 契约"
depends = ["bundle"]
sources = ["contracts/http/dist/openapi.yaml"]
outputs = ["apps/server/src/server/contracts.py"]

[tasks."codegen:ts"]
run = [
  "cd apps/web && bun x orval",
  "bun x oxfmt apps/web/src/contracts",
]
description = "生成 TypeScript 契约"
depends = ["bundle"]
sources = ["contracts/http/dist/openapi.yaml"]
outputs = [
  "apps/web/src/contracts/http/**",
  "apps/web/src/contracts/schemas/**",
]

[tasks."check:bundle"]
run = "git diff --exit-code -- contracts/http/dist"
description = "校验契约制品无差异"
depends = ["bundle"]

[tasks."check:codegen"]
run = "git diff --exit-code -- apps/server/src/server/contracts.py apps/web/src/contracts/http apps/web/src/contracts/schemas contracts/http/dist"
description = "校验契约生成物无差异"
depends = ["codegen"]

[tasks.size]
run = "bun run --filter @app/web size"
description = "体积预算检查"
depends = ["build:web"]

[tasks.up]
run = "$COMPOSE up -d --remove-orphans --wait"
description = "启动服务"

[tasks.down]
run = "$COMPOSE down --remove-orphans"
description = "停止服务"

[tasks.hooks]
run = "lefthook install"
description = "安装钩子"
