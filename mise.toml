# mise - `https://mise.jdx.dev/`

# 设置
[settings]
# 自动安装缺失工具
auto_install = false
# 安装时强制使用锁文件
locked = true
# 自动创建并维护锁文件
lockfile = true

# 工具
[tools]
actionlint = "latest"
cocogitto = "latest"
dprint = "latest"
"github:tufin/oasdiff" = "latest"
gitleaks = "latest"
lefthook = "latest"
trivy = "latest"
typos = "latest"
vacuum = "latest"
zizmor = "latest"

# 任务
[tasks.list]
description = "列出任务"
run = [
  "mise tasks ls",
]

[tasks.lock]
description = "锁定版本"
run = [
  "mise lock",
]

[tasks.install]
description = "安装工具"
depends = ["lock"]
run = [
  "mise install --locked",
]

[tasks.lint]
description = "代码检查"
run = [
  "dprint check",
  "typos",
  "actionlint",
  "zizmor .",
  "gitleaks git .",
]

[tasks.format]
description = "代码格式化"
run = [
  "dprint fmt",
]

[tasks.contracts]
description = "契约检查"
dir = "contracts/http"
run = [
  "vacuum lint --ruleset vacuum.yaml openapi.yaml",
]
