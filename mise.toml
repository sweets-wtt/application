# mise - `https://mise.jdx.dev/`

# 设置
[settings]
# 锁文件
lockfile = true
# 严格锁定
locked = true
# 自动安装
auto_install = false
# 缺失自动安装
not_found_auto_install = false
# 系统回退
not_found_system_fallback = false

# 工具（命令： `mise use <tool>@<version>` ）
[tools]
# 任务运行 - `https://github.com/casey/just`
"aqua:casey/just" = "1.58.0"
# 格式化 - `https://dprint.dev/`
"aqua:dprint/dprint" = "0.57.4"
# 拼写检查 - `https://github.com/crate-ci/typos`
"aqua:crate-ci/typos" = "1.50.1"
# 提交检查 - `https://docs.cocogitto.io/`
"aqua:cocogitto/cocogitto" = "7.0.0"
# 钩子管理 - `https://lefthook.dev/`
"aqua:evilmartians/lefthook" = "2.1.14"
# 密钥扫描 - `https://github.com/gitleaks/gitleaks`
"aqua:gitleaks/gitleaks" = "8.30.1"
# 漏洞扫描 - `https://trivy.dev/`
"aqua:aquasecurity/trivy" = "0.74.0"
# 语法检查 - `https://rhysd.github.io/actionlint/`
"aqua:rhysd/actionlint" = "1.7.12"
# 工作流审计 - `https://docs.zizmor.sh/`
"aqua:zizmorcore/zizmor" = "1.30.0"
