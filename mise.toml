# mise - `https://mise.jdx.dev/`

# 设置
[settings]
# 自动安装缺失工具
auto_install = false
# 安装时强制使用锁文件
locked = true
# 自动创建并维护锁文件
lockfile = true

# 工具
[tools]

# 任务
[tasks.list]
description = "列出任务"
run = [
  "mise tasks ls",
]

[tasks.lock]
description = "锁定版本"
run = [
  "mise lock",
]

[tasks.install]
description = "安装工具"
depends = ["lock"]
run = [
  "mise install --locked",
]
