# 设置
[settings]
# 缺失时自动安装 - 默认 true, 显式关闭
auto_install = false
# 严格锁文件模式 - 默认 false
locked = true
# 锁文件 - 非默认, 显式开启
lockfile = true
# 未找到命令回退系统 - 默认 true
not_found_system_fallback = false

# 工具
[tools]
# 漏洞扫描
"aqua:aquasecurity/trivy" = "0.76.1"
# 运行时管理
"aqua:astral-sh/uv" = "0.13.7"
# 任务管理
"aqua:casey/just" = "1.59.0"
# 提交检查
"aqua:cocogitto/cocogitto" = "7.0.0"
# 拼写检查
"aqua:crate-ci/typos" = "1.52.0"
# 契约检查
"aqua:daveshanley/vacuum" = "0.36.2"
# 代码格式
"aqua:dprint/dprint" = "0.64.3"
# 钩子管理
"aqua:evilmartians/lefthook" = "2.2.2"
# 密钥扫描
"aqua:gitleaks/gitleaks" = "8.30.1"
# 语法检查
"aqua:rhysd/actionlint" = "1.7.12"
# 工作流审计
"aqua:zizmorcore/zizmor" = "1.32.0"
# 运行时管理
bun = "1.4.4"
# 兼容检查
"github:tufin/oasdiff" = "v1.35.0"
