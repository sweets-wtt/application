# 设置
[settings]
# 锁文件
lockfile = true
# 严格模式
locked = true
# 自动安装
auto_install = false
# 缺失自动安装
not_found_auto_install = false

# 工具
[tools]
"aqua:Boeing/config-file-validator" = "2.3.0"
"aqua:dprint/dprint" = "0.58.0"
"aqua:crate-ci/typos" = "1.51.1"
"aqua:cocogitto/cocogitto" = "7.0.0"
"aqua:evilmartians/lefthook" = "2.2.1"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:daveshanley/vacuum" = "0.33.0"
"aqua:Orange-OpenSource/hurl" = "8.0.1"
"github:tufin/oasdiff" = "1.33.0"
"github:F1bonacc1/process-compose" = "1.122.0"

# 任务
[tasks.install]
description = "安装"
depends = [
  "install:tools",
]

[tasks."install:tools"]
description = "安装工具"
run = [
  "mise install --locked",
  "lefthook install",
]

[tasks.lint]
description = "检查"
depends = [
  "lint:validate",
  "lint:format",
  "lint:spell",
  "lint:secret",
  "lint:openapi",
  "lint:compat",
]

[tasks."lint:validate"]
description = "配置校验"
run = [
  "validator",
]

[tasks."lint:format"]
description = "格式检查"
run = [
  "dprint check --allow-no-files",
]

[tasks."lint:spell"]
description = "拼写检查"
run = [
  "typos --force-exclude",
]

[tasks."lint:secret"]
description = "密钥检查"
run = [
  "gitleaks git --pre-commit --staged --redact",
]

[tasks."lint:openapi"]
description = "契约检查"
dir = "contracts/http"
run = [
  "vacuum lint --ruleset vacuum.yaml openapi.yaml",
]

[tasks."lint:compat"]
description = "兼容性检查"
dir = "contracts/http"
shell = "bash -c"
run = [
  "git show origin/main:contracts/http/openapi.yaml 2>/dev/null | oasdiff breaking --fail-on ERR - openapi.yaml",
]

[tasks.format]
description = "格式化"
depends = [
  "format:dprint",
]

[tasks."format:dprint"]
description = "代码格式"
run = [
  "dprint fmt",
]

[tasks."stack:up"]
description = "启动编排"
run = [
  "process-compose up -t=false --env infra/.env",
]

[tasks."stack:down"]
description = "停止编排"
dir = "infra"
run = [
  "process-compose down",
]

[tasks.verify]
description = "验收测试"
run = [
  "hurl --test --variables-file infra/.env tests/docker/observe.hurl tests/docker/tls.hurl",
]
