# 设置
[settings]
# 自动安装
auto_install = false
# 严格锁文件
locked = true
# 锁文件
lockfile = true
# 系统回退
not_found_system_fallback = false

# 全局工具
[tools]
# 漏洞扫描
"aqua:aquasecurity/trivy" = "0.76.2"
# Python 运行时
"aqua:astral-sh/uv" = "0.13.7"
# 提交规范
"aqua:cocogitto/cocogitto" = "7.0.0"
# 拼写检查
"aqua:crate-ci/typos" = "1.52.2"
# 契约检查
"aqua:daveshanley/vacuum" = "0.40.0"
# 代码格式化
"aqua:dprint/dprint" = "0.64.3"
# Git 钩子
"aqua:evilmartians/lefthook" = "2.2.2"
# 密钥扫描
"aqua:gitleaks/gitleaks" = "8.30.1"
# 任务运行
"aqua:go-task/task" = "3.54.0"
# 工作流语法检查
"aqua:rhysd/actionlint" = "1.7.12"
# 工作流审计
"aqua:zizmorcore/zizmor" = "1.32.0"
# JavaScript 运行时
bun = "1.4.4"
# 契约兼容
"github:tufin/oasdiff" = "v1.37.0"
