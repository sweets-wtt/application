# 最低版本
min_version: "2.2.2"
# 未安装时直接报错
assert_lefthook_installed: true
# 非交互环境不分配 TTY
no_tty: true

# 模板
templates:
  # just 配方入口
  just: mise exec -- just

# 下拉后
post-merge:
  jobs:
    # 同步依赖
    - name: install
      run: "{just} install"
      fail_text: "依赖同步失败: just install"

# 提交前
pre-commit:
  jobs:
    # 全量检查
    - name: check
      run: "{just} check"
      fail_text: "提交前检查失败: just check"

# 提交信息
commit-msg:
  jobs:
    # Conventional Commits 校验
    - name: cog
      run: "{just} check-commit {1}"
      fail_text: "提交信息不符合 Conventional Commits"

# 推送前检查
pre-push:
  jobs:
    # 契约生成物漂移检查
    - name: contract
      run: "{just} check-codegen"
      fail_text: "契约生成物存在漂移"
    # 全量测试
    - name: test
      run: "{just} test"
      fail_text: "测试失败: just test"
