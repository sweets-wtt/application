# 下拉后 - 依赖可能已变更，先同步
post-merge:
  jobs:
    - name: install
      run: mise exec -- just install

# 提交前 - 在取得提交信息之前执行
pre-commit:
  jobs:
    - name: lint
      run: mise exec -- just lint

# 提交信息 - 在提交信息准备完成后执行
commit-msg:
  jobs:
    - name: cog
      run: mise exec -- cog verify --file {1}

# 推送前 - 最后一道闸
pre-push:
  jobs:
    - name: test
      run: mise exec -- just test
