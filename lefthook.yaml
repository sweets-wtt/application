# 下拉后 - 依赖可能已变更，先同步
post-merge:
  # 任务
  jobs:
    # 初始化
    - name: install
      # 运行命令
      run: mise run install

# 提交前 - 在取得提交信息之前执行
pre-commit:
  # 任务
  jobs:
    # 代码检查
    - name: lint
      # 运行命令
      run: mise run lint

# 提交信息 - 在提交信息准备完成后执行
commit-msg:
  # 任务
  jobs:
    # 提交检查
    - name: cog
      # 运行命令
      run: mise exec -- cog verify --file {1}

# 推送前 - 最后一道闸
pre-push:
  # 任务
  jobs:
    # 测试
    - name: test
      # 运行命令
      run: mise run test
