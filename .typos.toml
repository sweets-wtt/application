# 默认规则
[default]
# 跳过二进制文件
binary = false
# 检查文件内容
check-file = true
# 检查文件名
check-filename = true

# 文件
[files]
# 额外排除
extend-exclude = [
  # 锁文件
  "*.lock",
  # Python 契约生成物
  "apps/server/src/server/generated/**",
  # TypeScript 契约生成物
  "apps/web/src/api/generated/**",
  # 契约打包制品
  "contracts/http/dist/**",
]
